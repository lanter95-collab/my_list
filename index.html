<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的清單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface2:#f4f7f9; --ink:#1d2b36; --muted:#6b7c89; --line:#d9e1e7;
  --accent:#1f6f8b; --accent-ink:#ffffff; --done:#9aa8b2; --danger:#c0392b; --tick:#2e9e6b;
  --sub:#dcf1e3; --sub-soft:#f1faf4; --sub-line:#7cc596;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#10171c; --surface:#18222a; --surface2:#1d2a33; --ink:#e6edf2; --muted:#8a9aa6; --line:#2a3842; --accent:#4fb0cf; --accent-ink:#0c1a21; --done:#5d6e7a; --danger:#ff7a6b; --tick:#43c48a; --sub:#1e3d2e; --sub-soft:#172a21; --sub-line:#3f8f64;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5;
  touch-action:manipulation;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 150px}
header{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
header h1{font-size:22px;margin:0;flex:1;font-weight:700;letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.icon-btn:focus-visible,.btn:focus-visible,input:focus-visible,.row:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 14px;height:44px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.warn{background:var(--danger);color:#fff}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:4px}
.sync.home{cursor:default}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center}
.lock .lk{font-size:38px;line-height:1;margin-bottom:8px}
.lock p{margin:6px 0 12px}
.lock .hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--done)}
.dot.on{background:var(--tick)} .dot.busy{background:#e0a528} .dot.err{background:var(--danger)}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;flex:1;min-width:0;user-select:text;-webkit-user-select:text}
.title-in{font-size:20px;font-weight:700;flex:1}

/* home */
.group{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px 10px;margin-bottom:6px}
.group{cursor:pointer}
.group .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.group .name{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px 2px;margin-bottom:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 0 2px}
.tile .wrap52{position:relative;width:52px;height:52px}
.tile .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;position:relative;overflow:hidden}
.tile .ico i{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.9)}
.tile .nm{font-size:12px;text-align:center;max-width:78px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.3}
.tile .ct{font-size:11px;color:var(--muted);margin-top:-3px}
.badge{position:absolute;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.badge::after{content:"";position:absolute;inset:-6px}
.badge.l{left:-8px}.badge.r{right:-8px}
.group .name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.group .cnt{color:var(--muted);font-size:14px;white-space:nowrap}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tick);width:0;transition:width .25s}
.add-group{display:flex;gap:8px;margin:0 0 12px}
.btn.plus{width:44px;padding:0;font-size:24px;line-height:1}
.line .btn.plus{width:44px;padding:0;font-size:24px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:14px;margin-bottom:12px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:12px;margin:0 2px 10px;min-height:40px}
.master{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px 0 10px;height:40px;font-size:14px}
.toolbar .sum{color:var(--muted);font-size:14px;margin-left:auto}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:0 2px 0 12px;min-height:36px;border-bottom:1px solid var(--line);cursor:pointer;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--surface)}
.list>.row:last-child,.children>.row:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;background:transparent;padding:0}
.box svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:all .12s}
.on>.box,.box.on{background:var(--tick);border-color:var(--tick)}
.on>.box svg,.box.on svg{stroke:#fff;opacity:1;transform:scale(1)}
.num{flex:none;color:var(--muted);font-size:12px;min-width:1.8em;text-align:right;font-variant-numeric:tabular-nums}
.txt{flex:1;padding:7px 0;font-size:12px;overflow-wrap:anywhere;min-width:0}
.qty{flex:none;min-width:2.4em;text-align:right;color:var(--muted);padding:7px 2px;font-size:12px;font-variant-numeric:tabular-nums}
.qty:empty{display:none}
.row.done .txt{color:var(--done);text-decoration:line-through}
.row.done .qty{color:var(--done)}
.mini{flex:none;background:none;border:0;color:var(--muted);width:34px;height:36px;font-size:15px;border-radius:10px;opacity:.55;padding:0}
.mini:hover{opacity:1}
.del{font-size:17px}
.sub{border-bottom:1px solid var(--line)}
.list>.sub:last-child{border-bottom:0}
.subhead{background:var(--sub);font-weight:500}
.subhead .cnt{flex:none;color:var(--muted);font-size:12px;font-weight:400}
.subhead .txt{font-size:13px}
.children{margin-left:18px;border-left:3px solid var(--sub-line);background:var(--sub-soft)}
.children:empty{border-left:0}
.children .row{padding-left:8px;background:transparent}
body.drag-item .children{min-height:40px}
.sub.hot>.subhead{outline:2px solid var(--tick);outline-offset:-2px}
.sub.hot>.children{background:var(--sub)}
.mvline{flex:1 1 100%;display:flex;align-items:center;gap:8px;padding-left:38px;font-size:14px;color:var(--muted)}
.mvline select{flex:1;min-width:0;height:38px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.addform{display:flex;gap:8px;align-items:center}
.addform input{height:40px}
.a-qty,.e-qty,.e-need{flex:none!important;width:62px;text-align:center;min-width:0}
.e-qty{width:62px}
.addform .btn{height:40px;padding:0 12px;font-size:14px}
.row.editing{flex-wrap:wrap;cursor:default;gap:8px;padding:6px 8px 6px 12px;user-select:text;-webkit-user-select:text}
.row.editing input{height:40px}
.ok{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;width:40px;height:40px;font-size:18px;flex:none}
.addbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0))}
.addbar .in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl,.line{display:flex;gap:8px;align-items:center}
.ctl select{flex:none;max-width:60%;min-width:56px;height:40px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.ctl .btn,.line .btn{height:40px;padding:0 14px;font-size:14px}
.btn.mode{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.mode.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.line input[type=text]{height:44px}
.line .a-qty{height:44px}
.line .btn{height:44px}
.btn[disabled]{opacity:.4}
@media (min-width:700px){.addbar .in{flex-direction:row;align-items:center}.addbar .ctl{flex:none}.addbar .line{flex:1.4}.addbar .line2{flex:1.2}}

/* drag */
.placeholder{opacity:.35;background:var(--surface2)}
.dragghost{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.28);opacity:.96;overflow:hidden}

dialog{border:0;border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 8px;font-size:18px}
dialog p{margin:6px 0 12px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
dialog .acts .btn{height:36px;padding:0 16px;font-size:14px;border-radius:9px}
dialog input{width:100%}
dialog select{width:100%;height:40px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.toolbar .imp{height:40px;padding:0 14px;font-size:14px}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* 每個群組、小群組各自的底色（色相隨機；沒有分組的項目維持原樣） */
.sub{--sub:hsl(var(--h,140) 55% 88%);--sub-soft:hsl(var(--h,140) 60% 94%);--sub-line:hsl(var(--h,140) 45% 62%)}
.group{background:hsl(var(--h,200) 55% 95%);border-color:hsl(var(--h,200) 40% 82%)}
@media (prefers-color-scheme: dark){
  /* 深色模式：用高彩度、中低亮度的底色，維持繽紛，同時讓淺色文字清楚 */
  .sub{--sub:hsl(var(--h,140) 58% 27%);--sub-soft:hsl(var(--h,140) 44% 20%);--sub-line:hsl(var(--h,140) 68% 50%);--muted:#cdd8df;--done:#b2c1cb}
  .group{background:hsl(var(--h,200) 48% 22%);border-color:hsl(var(--h,200) 55% 36%)}
}
/* 項目照片（☁️ 上傳、10×10 縮圖、點開看大圖） */
.pic{display:inline-flex;align-items:center;justify-content:center;position:relative;width:16px;height:28px;margin-left:0;vertical-align:middle;font-size:14px;line-height:1;cursor:pointer;opacity:.75}
.pic.first{margin-left:1.6em}
.pic::after{content:"";position:absolute;inset:-4px -2px}
.pic:hover,.pic:focus-visible{opacity:1}
.pic img{width:10px;height:10px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px var(--line);display:block}
.viewer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:flex;flex-direction:column;color:#fff}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.vbar .vt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .vb{height:36px;padding:0 14px;font-size:14px;border-radius:9px}
.vbox{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
.vbox img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;cursor:zoom-in}
@supports (height:100dvh){.vbox img{max-height:calc(100dvh - 150px)}}
.vbox.full{display:block}
.vbox.full img{max-width:none;max-height:none;cursor:zoom-out}
.vfoot{padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:#b8c4cc}
.vfoot a{color:#9fd3ff}
/* 日期／金額欄位（只在有開啟的群組出現） */
.line2{display:flex;gap:8px;align-items:center}
.line2 input{height:40px;flex:1;min-width:0}
.line2 .a-date{flex:1.6}
.meta{display:inline-block;font-size:8px!important;line-height:1;color:var(--muted);margin-left:6px;white-space:nowrap;vertical-align:baseline}
.wrap.tall{padding-bottom:200px}
.mvline input{flex:1;min-width:0;height:38px;font-size:16px}
dialog label.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14px;color:var(--ink)}
dialog input[type=checkbox]{width:18px;height:18px;flex:none}
/* 底部輸入列：由左到右 選單｜Ｇ｜Ｍ｜名稱｜日期｜金額｜數量｜＋ */
.addbar .in{max-width:600px;margin:0 auto -8px;display:flex;flex-direction:row;flex-wrap:wrap;gap:0 8px;align-items:center}
.addbar .in>*:not(.brk){margin-bottom:8px;min-width:0}
.addbar .in .brk{display:none}
.addbar select{flex:none;max-width:40%;min-width:56px;height:40px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.addbar .btn{height:40px;padding:0 12px;font-size:14px;flex:none}
.addbar .btn.plus{width:40px;padding:0;font-size:22px;margin-left:auto}
.addbar input[type=text]{height:40px}
.addbar .a-name{flex:1 1 110px}
.addbar .a-date{flex:0 0 104px}
.addbar .a-amt{flex:0 0 84px}
@media (max-width:559px){
  .addbar .in .brk{display:block;flex-basis:100%;height:0}
  .addbar .a-date{flex:1.6 1 0}
  .addbar .a-amt{flex:1 1 0}
  .addbar .btn.plus{width:44px}
}
.num.code{min-width:0;white-space:nowrap;font-weight:500;letter-spacing:.02em}
.ncheck{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;padding:8px 4px}
.ncheck.off{color:var(--ink);font-weight:700}
/* 露營／旅遊群組：打勾的項目顯示藍色文字，不加刪除線、不變淡 */
:root{--packblue:#0b5cc4}
@media (prefers-color-scheme: dark){:root{--packblue:#8ccbff}}
.pack .row.done .txt,.pack .row.done .qty{color:var(--packblue);text-decoration:none}
.pack .row.done .txt{font-weight:500}
.toolbar{flex-wrap:wrap;row-gap:6px}
.toolbar .undo{width:40px;padding:0;font-size:18px}
.utoast{position:fixed;left:50%;transform:translateX(-50%);z-index:85;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:92vw}
.utoast button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;height:32px;padding:0 12px;font-size:14px;font-weight:500}
/* 群組頁：標題列＋工具列固定在上方，下面的清單捲動 */
.gtop{position:sticky;top:0;z-index:30;background:var(--bg);margin:-16px -16px 10px;padding:16px 16px 8px;border-bottom:1px solid var(--line)}
.gtop header{margin:0 0 8px}
.gtop .toolbar{margin:0 2px}
/* 搬移模式：粉紅＝選取要搬的、淺灰＝已鎖定的原有勾 */
.box.sel{background:#e5398a;border-color:#e5398a}
.box.sel svg{stroke:#fff;opacity:1;transform:scale(1)}
.on>.box.locked,.box.locked{background:var(--line);border-color:var(--line)}
.on>.box.locked svg,.box.locked svg{stroke:#9aa8b2;opacity:1;transform:scale(1)}
.btn.mode.move-on{background:#e5398a;color:#fff;border-color:#e5398a}
.btn.mode[disabled]{opacity:.4}
.master[disabled]{opacity:.45;cursor:not-allowed}
.toolbar .sum.mv{color:#e5398a;font-weight:500}
.addbar .mvhint{flex:1 1 0;min-width:0;font-size:13px;line-height:1.3;color:#e5398a}
/* 打勾三段：綠底白勾＝有帶、整格灰＝不帶；最上方的全選框是藍底白勾 */
.box.skip{background:#a7b3bc;border-color:#a7b3bc}
@media (prefers-color-scheme: dark){.box.skip{background:#5d6e7a;border-color:#5d6e7a}}
.box.blue{background:#2f7de1;border-color:#2f7de1}
.box.blue svg{stroke:#fff;opacity:1;transform:scale(1)}
.master{padding:0 10px;gap:0}
.toolbar .imp:not(.undo){padding:0 12px;font-size:16px}
/* 小群組的 ⤓ ⤒ */
.pbtn{display:inline-flex;align-items:center;justify-content:center;position:relative;width:16px;height:28px;margin-left:2px;vertical-align:middle;font-size:14px;line-height:1;color:var(--muted);cursor:pointer;opacity:.85}
.pbtn.bot{margin-left:6px}
.pbtn::after{content:"";position:absolute;inset:-4px -2px}
.pbtn:hover,.pbtn:focus-visible{opacity:1}
.pbtn.on{color:var(--ink);font-weight:700;opacity:1}

/* ===== 數量：「要帶 / 已有」，左邊紫色 ===== */
:root{--needpurple:#8e3fc4}
@media (prefers-color-scheme: dark){:root{--needpurple:#cfa2ff}}
.qty{white-space:nowrap;min-width:3.6em}
.qty .q-need{color:var(--needpurple);font-weight:500}
input.e-need{color:var(--needpurple);font-weight:500}
.pv-q{white-space:nowrap}
.pv-need{color:#8e3fc4;font-weight:500}
.addbar .btn.mode{font-size:18px}
.addbar .btn.plus{font-size:20px}

/* ===== 小小群組（第二層） ===== */
.children .row.subhead{background:var(--sub)}
.children>.sub{border-bottom:1px solid var(--line)}
.children>.sub:last-child{border-bottom:0}
.sub2 .children{margin-left:14px}
.sub2>.subhead .txt{font-size:12px}
.pv-gg{margin-left:10px;margin-bottom:3px}
.pv-gg>.pv-sub{font-size:.95em;font-weight:600}

/* ===== 工具列按鈕縮小（全選、匯入、復原、重整、生成網頁） ===== */
.toolbar{gap:6px}
.toolbar .master{height:34px;padding:0 5px}
.toolbar .master .box{width:22px;height:22px;border-radius:7px}
.toolbar .btn.imp,.toolbar .btn.imp:not(.undo){height:34px;min-width:34px;padding:0 6px;font-size:14px;border-radius:9px}
.toolbar .btn.imp.undo{width:34px;padding:0;font-size:15px}
.toolbar .sum{font-size:12px}

/* ===== ⋯ 功能選單／MEMO ===== */
.tm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.tm-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 0 8px}
.tm-btn[disabled]{opacity:.4}
.tm-ico{font-size:26px;line-height:1}
.tm-lb{font-size:12px;color:var(--muted)}
.notes-ta{width:100%;min-height:200px;font:inherit;font-size:16px;line-height:1.5;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;user-select:text;-webkit-user-select:text}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ Firebase 設定（之後貼上你的設定） ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZnudTiv8p3QjOFzU31bGTGXi75-eeMVs",
  authDomain: "mylist-ac778.firebaseapp.com",
  projectId: "mylist-ac778",
  storageBucket: "mylist-ac778.firebasestorage.app",
  messagingSenderId: "173776942369",
  appId: "1:173776942369:web:fb3d5fed45fe5b3ccdfa60"
};
/* =========================================================== */

const LS_DATA = 'mylists-v1', LS_CODE = 'mylists-sync-code';
const CLOUD_NAME = 'keloftva';                   // 項目照片上傳到 Cloudinary：填你的 Cloud name（Dashboard 可看到）
const UPLOAD_PRESET = 'equipment';                      // 你建立的 Unsigned upload preset 名稱（資料夾 camping 已設在 preset 裡）
const PHOTO_MAX_SIDE = 2400;                            // 照片長邊上限（px），上傳前先縮小以加快速度；設 0 = 不縮小
const INDEX_ID = '_group_index';   // 群組清單（只有名稱，不含內容）放在這份雲端文件
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const $ = s => document.querySelector(s);

/* 資料結構
   state.groups = [{ id, name, items:[ 項目 或 小群組 ] }]
   項目   = { id, text, qty, done }
   小群組 = { id, name, items:[項目...], collapsed, done }   (有 items 陣列就是小群組)  */
let state = load();
/* 記住畫面狀態：重新整理後回到原本開著的群組、捲動位置、選好的小群組 */
const LS_UI = 'mylists-ui';
let ui = (() => { try{ return JSON.parse(localStorage.getItem(LS_UI)) || {}; }catch(e){ return {}; } })();
const saveUI = () => { try{ localStorage.setItem(LS_UI, JSON.stringify(ui)); }catch(e){} };
let view = (ui.view && state.groups.some(g => g.id === ui.view)) ? ui.view : null;   // 目前開啟的大群組 id
let editing = null;              // { id, field:'text'|'qty' }，id='__title' 代表群組標題
let refocus = false, undoSnap = null, pendingRender = false;
let addTarget = (view && ui.t && ui.t[view]) || '', uploadingId = null;
let onlyTodo = false;     // 「只看未準備」：只顯示沒打勾的項目（所屬小群組名稱會保留）；只是畫面上的篩選，不會改動資料
const todoLeaf = x => !isSub(x) && stateOf(x) === 0;
const hasTodo = x => leavesOf(x.items).some(todoLeaf);
const visTodo = x => isSub(x) ? (stateOf(x) === 0 || hasTodo(x)) : stateOf(x) === 0;
let moveMode = false, moveSel = new Set();     // 搬移模式：鎖住原有的勾，只勾選要搬的項目
let homeView = localStorage.getItem('mylists-homeview') || 'list';
let db = null;

function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_DATA)); if(d && Array.isArray(d.groups)){ d.deleted = d.deleted || []; return d; } }catch(e){}
  return { groups: [], deleted: [], updatedAt: 0 };
}
function commit(g){
  g = g || (view ? group(view) : null);
  const now = Date.now();
  if(g) g.updatedAt = now;
  state.updatedAt = now;
  saveLocal();
  render();
  if(g) pushSoon(g);
}
const group = id => state.groups.find(g => g.id === id);
const appTitle = () => state.title || '我的清單';
/* 手機：按住標題、放開後進入修改（和電腦的「點兩下」並存） */
function longPress(node, fn, ms = 450){
  let t = null, armed = false, sx = 0, sy = 0;
  const clear = () => { clearTimeout(t); t = null; armed = false; };
  node.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse') return;
    sx = e.clientX; sy = e.clientY; armed = false;
    t = setTimeout(() => { armed = true; if(navigator.vibrate) navigator.vibrate(10); }, ms);
  });
  node.addEventListener('pointermove', e => { if((t || armed) && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) clear(); });
  node.addEventListener('pointerup', () => { const go = armed; clear(); if(go){ suppressUntil = Date.now() + 500; fn(); } });
  node.addEventListener('pointercancel', clear);
  node.addEventListener('contextmenu', e => e.preventDefault());
}
const isSub = it => Array.isArray(it.items);
/* 結構最多兩層：小群組（大包包）→ 小小群組（小包包）→ 項目 */
function leavesOf(arr, out = []){
  arr.forEach(it => { if(isSub(it)){ if(it.items.length) leavesOf(it.items, out); else out.push(it); } else out.push(it); });
  return out;
}
function allNodes(arr, out = []){ arr.forEach(it => { out.push(it); if(isSub(it)) allNodes(it.items, out); }); return out; }
const subDone = s => { const lv = leavesOf(s.items); return lv.length ? lv.every(i => i.done) : !!s.done; };
const leaves = g => leavesOf(g.items);
function findIn(arr, id){
  for(const it of arr){
    if(it.id === id) return { it, arr };
    if(isSub(it)){ const r = findIn(it.items, id); if(r) return r; }
  }
  return null;
}
const find = (g, id) => findIn(g.items, id);
const ownerOf = (g, arr) => arr === g.items ? null : (allNodes(g.items).find(x => isSub(x) && x.items === arr) || null);
const flatSubs = g => { const out = []; g.items.forEach(it => { if(isSub(it)){ out.push({ s: it, d: 0 }); it.items.filter(isSub).forEach(c => out.push({ s: c, d: 1 })); } }); return out; };
const subOptions = g => flatSubs(g).map(o => el('option', { value: o.s.id }, (o.d ? '　└ ' : '') + o.s.name));
/* 群組欄位類型：plain 一般（數量）／money 購物（日期、金額、數量）／todo 待辦（日期，無數量）。
   名稱含 Shopping／購物 → 購物；To Do／Q&A → 待辦；可在群組「⋯」手動改 */
const isPack = g => !!g && /camping|travel|露營|旅/.test(norm(g.name));   // 露營／旅遊類：打勾＝「有帶」，文字變藍色、不畫刪除線
function kindOf(g){
  if(!g) return 'plain';
  const o = g.opts || {};
  if(o.kind === 'money' || o.kind === 'todo' || o.kind === 'plain') return o.kind;
  if(typeof o.money === 'boolean') return o.money ? 'money' : 'plain';
  const n = norm(g.name);
  if(/shopping|購物/.test(n)) return 'money';
  if(/to\s*do|q\s*&\s*a/.test(n)) return 'todo';
  return 'plain';
}
function parseDate(v){            // '' = 沒填；null = 格式不對；否則回傳 8 碼 YYYYMMDD
  const d = String(v || '').replace(/\D/g, '');
  if(!d) return '';
  if(d.length === 8){ const mo = +d.slice(4, 6), da = +d.slice(6, 8); if(mo >= 1 && mo <= 12 && da >= 1 && da <= 31) return d; }
  return null;
}
function parseAmt(v){             // '' = 沒填；null = 不是數字
  const t = String(v || '').replace(/[,，\s]/g, '');
  if(!t) return '';
  return /^\d{1,9}(\.\d{1,2})?$/.test(t) ? Number(t) : null;
}
const fmtAmt = v => Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
const cleanQty = v => { const s = String(v ?? '').replace(/\D/g, '').slice(0, 5); return s === '' ? '' : Number(s); };

/* ---------- 同步（每個群組各自一組代碼；有代碼才會上雲端） ---------- */
const configured = () => !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const unsubs = {}, timers = {}, gstat = {};
const cleanCode = v => String(v || '').trim().replace(/[\/\s]/g, '');
const saveLocal = () => localStorage.setItem(LS_DATA, JSON.stringify(state));
const kind = s => s === 'on' ? 'on' : s === 'busy' ? 'busy' : s === 'err' ? 'err' : '';
function ensureDb(){
  if(db) return db;
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try{ db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); }catch(e){}   // 離線時的修改會排隊，連線後自動補傳
  return db;
}
function groupStatusText(g){ return g.code ? ({ on: '已同步', busy: '同步中', err: '同步失敗', off: '未連線' }[gstat[g.id] || 'off']) : '未同步'; }
function aggregate(){
  const coded = state.groups.filter(g => g.code);
  if(!configured() || !coded.length) return { k: '', t: '僅存本機' };
  const st = coded.map(g => gstat[g.id] || 'off');
  if(st.includes('err')) return { k: 'err', t: '同步失敗' };
  if(st.includes('busy') || st.includes('off')) return { k: 'busy', t: '同步中…' };
  return { k: 'on', t: '已同步' };
}
function refreshBadges(){
  const h = $('.sync.home');
  if(h){ const a = aggregate(); h.querySelector('.dot').className = 'dot ' + a.k; h.querySelector('span').textContent = a.t; }
  const gb = $('.sync.gsync'), g = view && group(view);
  if(gb && g){ gb.querySelector('.dot').className = 'dot ' + kind(g.code ? gstat[g.id] : ''); gb.querySelector('span').textContent = groupStatusText(g); }
}
function setG(id, st){ gstat[id] = st; refreshBadges(); }
function stopListen(id){
  if(unsubs[id]){ unsubs[id](); delete unsubs[id]; }
  clearTimeout(timers[id]); delete timers[id]; delete gstat[id];
}
function listen(g){
  stopListen(g.id);
  if(!configured() || !g.code) return;
  try{
    const ref = ensureDb().collection('checklists').doc(g.code);
    setG(g.id, 'busy');
    unsubs[g.id] = ref.onSnapshot(snap => {
      const cur = group(g.id); if(!cur || cur.code !== g.code) return;
      if(snap.metadata.hasPendingWrites) return;
      const cache = snap.metadata.fromCache;
      if(!snap.exists){ if(!cache) pushNow(cur.id); return; }
      const remote = snap.data(); let data;
      try{ data = JSON.parse(remote.json); }catch(e){ setG(cur.id, 'err'); return; }
      if(!data || !Array.isArray(data.items)){ setG(cur.id, 'err'); return; }
      const ru = remote.updatedAt || 0, lu = cur.updatedAt || 0;
      if(ru > lu){
        cur.items = data.items; if(data.opts) cur.opts = data.opts; cur.updatedAt = ru; saveLocal();
        if(!editing) render();
      } else if(ru < lu && !cache){ pushNow(cur.id); return; }
      if(!data.gid && !cache){ pushNow(cur.id); return; }          // 舊資料補上群組識別
      if(!cache) setG(cur.id, 'on');
    }, err => { console.error(err); setG(g.id, 'err'); });
  }catch(e){ console.error(e); setG(g.id, 'err'); }
}
function pushSoon(g){
  if(!g || !g.code || !configured()) return;
  setG(g.id, 'busy');
  clearTimeout(timers[g.id]);
  timers[g.id] = setTimeout(() => pushNow(g.id), 500);
}
function pushNow(id){
  clearTimeout(timers[id]); delete timers[id];
  const g = group(id); if(!g || !g.code || !configured()) return;
  if(!g.updatedAt){ g.updatedAt = Date.now(); saveLocal(); }
  try{
    ensureDb().collection('checklists').doc(g.code)
      .set({ json: JSON.stringify({ gid: g.id, name: g.name, items: g.items, opts: g.opts || {} }), updatedAt: g.updatedAt })

/* ---------- 群組清單同步（不需代碼；只同步「有哪些群組、叫什麼」） ---------- */
let reconciling = false, reAgain = false;
function mergeIndex(remote, rmeta = {}){
  const map = new Map(remote.map(e => [e.id, { ...e }]));
  let changed = false;
  (state.deleted || []).forEach(id => {
    const e = map.get(id);
    if(!e || !e.del){ map.set(id, { id, del: true, t: Date.now() }); changed = true; }
  });
  state.groups.forEach(g => {
    const e = map.get(g.id);
    if(!e || (e.del && g.revive)){
      g.nameT = g.nameT || Date.now(); g.revive = false;
      map.set(g.id, { id: g.id, name: g.name, t: g.nameT }); changed = true;
    } else if(!e.del && (g.nameT || 0) > (e.t || 0)){
      e.name = g.name; e.t = g.nameT; changed = true;
    }
  });
  if(state.title && !state.titleT) state.titleT = Date.now();            // 舊版就有的標題，視為剛設定
  let meta = { title: rmeta.title || '', titleT: rmeta.titleT || 0 };
  if((state.titleT || 0) > meta.titleT){ meta = { title: state.title || '', titleT: state.titleT }; changed = true; }
  return { list: [...map.values()], meta, changed };
}
function applyIndex(list, meta = {}){
  let dirty = false;
  if((meta.titleT || 0) > (state.titleT || 0)){ state.title = meta.title || ''; state.titleT = meta.titleT; dirty = true; }
  list.forEach(e => {
    const g = group(e.id);
    if(e.del){
      if(g){ stopListen(g.id); state.groups = state.groups.filter(x => x.id !== g.id); if(view === g.id) view = null; dirty = true; }
      return;
    }
    if(!g){ state.groups.push({ id: e.id, name: e.name, items: [], code: '', updatedAt: 0, locked: true, nameT: e.t || 0 }); dirty = true; }
    else if((e.t || 0) > (g.nameT || 0)){ g.name = e.name; g.nameT = e.t; dirty = true; }
  });
  return dirty;
}
async function reconcileIndex(){
  if(!configured()) return;
  if(reconciling){ reAgain = true; return; }
  reconciling = true;
  try{
    const database = ensureDb(), ref = database.collection('checklists').doc(INDEX_ID);
    const sent = new Set(state.deleted || []);
    let merged = { list: [], meta: {} };
    await database.runTransaction(async tx => {
      const snap = await tx.get(ref);
      let remote = [];
      let rmeta = {};
      if(snap.exists){ try{ const j = JSON.parse(snap.data().json); remote = j.groups || []; rmeta = { title: j.title, titleT: j.titleT }; }catch(e){} }
      const r = mergeIndex(remote, rmeta);
      merged = r;
      if(r.changed || !snap.exists) tx.set(ref, { json: JSON.stringify({ groups: r.list, title: r.meta.title, titleT: r.meta.titleT }), updatedAt: Date.now() });
    });
    state.deleted = (state.deleted || []).filter(id => !sent.has(id));
    const dirty = applyIndex(merged.list, merged.meta);
    saveLocal();
    if(dirty && !editing) render();
  }catch(e){ console.error('群組清單同步失敗', e); }
  finally{ reconciling = false; if(reAgain){ reAgain = false; reconcileIndex(); } }
}
function startIndex(){
  if(!configured()) return;
  try{
    ensureDb().collection('checklists').doc(INDEX_ID).onSnapshot(snap => { if(!snap.metadata.hasPendingWrites) reconcileIndex(); }, e => console.error(e));
  }catch(e){ console.error(e); }
  reconcileIndex();
  window.addEventListener('online', reconcileIndex);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reconcileIndex(); });
}
async function unlockWithCode(g, code){
  if(!configured()){ toast('尚未設定 Firebase'); return; }

function openJoin(){

        state.groups.push(ng); saveLocal(); listen(ng); render(); toast(`已加入「${ng.name}」`); reconcileIndex();

/* ---------- 操作 ---------- */
/* 名稱不可重複（不分大小寫、全半形、前後空白） */
const norm = x => String(x || '').normalize('NFKC').trim().replace(/\s+/g, ' ').toLowerCase();
const groupNameTaken = (name, exceptId) => state.groups.some(x => x.id !== exceptId && norm(x.name) === norm(name));
const subNameTaken = (g, name, exceptId, arr) => (arr || g.items).some(x => isSub(x) && x.id !== exceptId && norm(x.name) === norm(name));   // 同一層不可重名
const itemNameTaken = (g, name, exceptId) => leavesOf(g.items).some(c => !isSub(c) && c.id !== exceptId && norm(c.text) === norm(name));
function addGroup(name){ name = name.trim(); if(!name) return; if(groupNameTaken(name)){ toast(`已有同名群組「${name}」（大小寫視為相同）`); return; } state.groups.push({ id: uid(), name, items: [], nameT: Date.now() }); commit(); reconcileIndex(); }
function renameGroup(id, name){ name = name.trim(); const g = group(id); if(g && name && norm(name) !== norm(g.name) && groupNameTaken(name, id)){ toast(`已有同名群組「${name}」，名稱未更改`); return; } if(g && name){ g.name = name; g.nameT = Date.now(); commit(g); reconcileIndex(); } }
function deleteGroup(id){ stopListen(id); state.groups = state.groups.filter(g => g.id !== id); state.deleted = [...(state.deleted || []), id]; view = null; commit(); reconcileIndex(); }
/* 「名稱╳數量」→ 名稱 + 數量（支援 ╳ × ✕ ，數量可用全形數字，後面可接 顆／個／支…；╳ 後面沒數字就當作沒有數量） */
const QTY_RE = /(?:\s*[╳×✕]\s*([0-9０-９]*)|\s+[xX]\s*([0-9０-９]+))\s*(?:顆|個|支|組|條|包|瓶|罐|隻|張|件|只|片|把|盒)?\s*$/;
function parseLine(t){
  t = t.trim();
  const m = t.match(QTY_RE);
  if(!m) return { text: t, qty: '' };
  const name = t.slice(0, m.index).trim();
  if(!name) return { text: t, qty: '' };
  const d = (m[1] || m[2] || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248));
  return { text: name, qty: d ? cleanQty(d) : '' };
}
function addItems(key, raw, qtyRaw, extra){
  const g = group(view); if(!g) return;
  const tr = key === 'root' ? null : findIn(g.items, key);
  const target = key === 'root' ? g.items : (tr && isSub(tr.it) ? tr.it.items : null);
  if(!target) return;
  const multi = /\r?\n/.test(raw);                     // 多行貼上：只用換行分隔（名稱裡的頓號不會被拆開）
  const parts = (multi ? raw.split(/\r?\n/) : raw.split(/、|，|,/)).map(x => x.trim()).filter(Boolean);
  if(!parts.length) return;
  let added = 0; const dup = [];
  parts.forEach(p => {
    const r = parseLine(p);
    if(itemNameTaken(g, r.text)){ dup.push(r.text); return; }
    let q = r.qty;
    if(parts.length === 1 && q === '') q = cleanQty(qtyRaw);
    const item = { id: uid(), text: r.text, qty: q, done: false };
    if(parts.length === 1 && extra){ if(extra.date) item.date = extra.date; if(extra.amt !== '') item.amt = extra.amt; }
    target.push(item);
    added++;
  });
  if(dup.length) toast(added ? `已略過 ${dup.length} 個重複項目` : `已有同名項目「${dup[0]}」（大小寫視為相同）`);
  if(added) commit();
}
const subHue = s => (typeof s.hue === 'number') ? s.hue : hue(s.id);
function pickHue(used){            // 隨機挑色相，並盡量和已有的小群組拉開距離
  let best = 0, bestD = -1;
  for(let i = 0; i < 30; i++){
    const c = Math.floor(Math.random() * 360);
    const d = used.length ? Math.min(...used.map(u => { const x = Math.abs(u - c) % 360; return Math.min(x, 360 - x); })) : 360;
    if(d > bestD){ bestD = d; best = c; }
  }
  return best;
}
function addSub(name){
  const g = group(view); name = name.trim(); if(!g || !name) return;
  /* 下方選單選了某個小群組 → 建立在它裡面（小小群組，只到這一層）；選 --- → 建立在最上層 */
  const pr = addTarget ? findIn(g.items, addTarget) : null;
  const parent = pr && isSub(pr.it) ? pr.it : null;
  if(parent){
    if(pr.arr !== g.items){ toast('小小群組裡面不能再建立下一層'); return; }
    if(subNameTaken(g, name, null, parent.items)){ toast(`「${parent.name}」裡已有同名小小群組「${name}」`); return; }
    const ss = { id: uid(), name, items: [], collapsed: false, done: false, hue: pickHue([subHue(parent), ...parent.items.filter(isSub).map(subHue)]) };
    const kidSubs = parent.items.filter(isSub), kidPlain = parent.items.filter(x => !isSub(x));
    parent.items.splice(0, parent.items.length, ...kidSubs, ss, ...kidPlain);
    addTarget = ss.id; refocus = true;
    toast(`已在「${parent.name}」裡建立小小群組「${name}」，接著新增的項目會放進去`);
    commit();
    return;
  }
  if(subNameTaken(g, name)){ toast(`已有同名小群組「${name}」（大小寫視為相同）`); return; }
  const sub = { id: uid(), name, items: [], collapsed: false, done: false, hue: pickHue(g.items.filter(isSub).map(subHue)) };
  const oldSubs = g.items.filter(isSub), plain = g.items.filter(x => !isSub(x));
  g.items.splice(0, g.items.length, ...oldSubs, sub, ...plain);                   // 小群組一律排在最上方：先建的在上，新建的接在後面
  addTarget = sub.id; refocus = true;
  toast(`已建立「${name}」，接著新增的項目會放進去`);
  commit();
}
function toggleItem(id){ const r = find(group(view), id); if(r){ pushUndo(); setState(r.it, (stateOf(r.it) + 1) % 3); commit(); } }   // 空 → 綠勾 → 灰（不帶）→ 空
/* ---------- 復原（只針對打勾；輸入的內容、搬移位置等不記錄） ---------- */
const undoStack = [];            // 只存在目前畫面，最多 6 筆，重新整理後清空
function pushUndo(){
  const g = group(view); if(!g) return;
  const items = allNodes(g.items).map(x => ({ id: x.id, st: stateOf(x) }));
  undoStack.push({ gid: g.id, items });
  if(undoStack.length > 6) undoStack.shift();
}
const canUndo = g => undoStack.some(e => e.gid === g.id);
function undoLast(){
  const g = group(view); if(!g) return;
  let k = -1; for(let i = undoStack.length - 1; i >= 0; i--) if(undoStack[i].gid === g.id){ k = i; break; }
  if(k < 0){ toast('沒有可以復原的動作'); return; }
  const [e] = undoStack.splice(k, 1);
  e.items.forEach(rec => { const r = find(g, rec.id); if(r) setState(r.it, rec.st); });
  if(e.order) restoreOrder(g, e.order);
  hideUndoToast(); commit(); toast('已復原');
}
let utimer = null;
function hideUndoToast(){ clearTimeout(utimer); const n = $('#utoast'); if(n) n.remove(); }
function showUndoToast(msg){
  hideUndoToast();
  const bh = ($('.addbar') || {}).offsetHeight || 0;
  const n = el('div', { id: 'utoast', class: 'utoast', style: `bottom:${bh + 12}px` }, el('span', {}, msg), el('button', { type: 'button', onclick: undoLast }, '復原'));
  document.body.append(n);
  utimer = setTimeout(hideUndoToast, 8000);
}

/* ---------- 勾選框的定義 ----------
   項目、小群組的框各自獨立：點一下＝黃底紅勾，再點一下＝取消。小群組的勾只代表「這個大物件要準備」，不會動到裡面的勾。
   只有最上方的「全選」才會一次全部打勾／全部取消。 */
const isMarked = s => typeof s.mark === 'boolean' ? s.mark : subDone(s);      // 舊資料沿用原本的判斷
function stateOf(x){ if(x.skip) return 2; return (isSub(x) ? isMarked(x) : !!x.done) ? 1 : 0; }
function setState(x, st){
  if(isSub(x)){ x.mark = st === 1; if(!x.items.length) x.done = st === 1; }
  else x.done = st === 1;
  if(st === 2) x.skip = true; else delete x.skip;
}
function toggleMark(id){            // 小群組的框：空 → 綠勾 → 灰（不帶）→ 空，不影響裡面的項目
  const r = find(group(view), id); if(!r) return;
  pushUndo(); setState(r.it, (stateOf(r.it) + 1) % 3); commit();
}
function counts(g){                 // 「不帶」的不算進總數
  const lv = leaves(g).filter(x => !x.skip);
  return { done: lv.filter(x => x.done).length, total: lv.length };
}

/* ---------- 搬移模式（Ｍ）：原有的勾全部鎖住；另外勾選要搬的項目，選好目的地再按 ＋ ---------- */
function setMoveMode(on){ moveMode = on; moveSel = new Set(); render(); }
function toggleSelItem(id){ moveSel.has(id) ? moveSel.delete(id) : moveSel.add(id); render(); }
function toggleSelSub(s){            // 批次：選取（或取消選取）這個小群組裡所有「沒打勾」的項目
  const kids = leavesOf(s.items).filter(c => !isSub(c) && stateOf(c) === 0); if(!kids.length) return;
  const allSel = kids.every(c => moveSel.has(c.id));
  kids.forEach(c => allSel ? moveSel.delete(c.id) : moveSel.add(c.id));
  render();
}
function moveSelected(destId){
  const g = group(view); if(!g) return;
  if(!moveSel.size){ toast('請先勾選要搬移的項目（粉紅色勾），再按 🟢'); return; }
  const dr = destId ? findIn(g.items, destId) : null;
  const destSub = dr && isSub(dr.it) ? dr.it : null;
  const dest = destId ? destSub?.items : g.items;
  if(!dest) return;
  const order = [];
  const collect = arr => arr.forEach(it => { if(isSub(it)) collect(it.items); else order.push({ c: it, arr }); });
  collect(g.items);
  let n = 0;
  order.filter(o => moveSel.has(o.c.id) && stateOf(o.c) === 0 && o.arr !== dest).forEach(o => { o.arr.splice(o.arr.indexOf(o.c), 1); dest.push(o.c); n++; });
  moveSel = new Set();
  const nm = destSub ? `「${destSub.name}」` : '最上層';
  if(!n){ toast(`選取的項目已經在${nm}`); render(); return; }
  toast(`已把 ${n} 項搬到${nm}`);
  commit();
}

/* 購物群組：小群組可以把勾選框收起來（表示整組已買齊）。收起來的項目不參與「全選」和「Ｍ」 */
const boxesHidden = (g, sub) => kindOf(g) === 'money' && !!sub.noCheck;
function checkables(g){              // 「全選」會動到的所有勾：項目＋小群組本身（勾選框被收起來的小群組除外）
  const out = [];
  const rec = arr => arr.forEach(it => { if(isSub(it)){ if(boxesHidden(g, it)) return; out.push(it); rec(it.items); } else out.push(it); });
  rec(g.items);
  return out;
}
function toggleNoCheck(id){ const r = find(group(view), id); if(r){ r.it.noCheck = !r.it.noCheck; commit(); } }
function setAll(v){
  const g = group(view); if(!g || moveMode) return;
  pushUndo();
  checkables(g).forEach(x => setState(x, v ? 1 : 0));
  commit(); showUndoToast(v ? '已全選' : '已全部取消');
}
function removeById(id){
  const g = group(view); const r = find(g, id);
  if(r){ r.arr.splice(r.arr.indexOf(r.it), 1); commit(); }
}
function toggleFold(id){ const r = find(group(view), id); if(r){ r.it.collapsed = !r.it.collapsed; commit(); } }

/* ---------- 畫面 ---------- */
function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs)){
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(k => e.append(k instanceof Node ? k : document.createTextNode(k)));
  return e;
}
function checkBox(st){                 // st: 0 空 / 1 綠底白勾（有帶）/ 2 灰底（不帶）；true 也視為 1
  const on = st === 1 || st === true, sk = st === 2;
  const b = el('span', { class: 'box' + (on ? ' on' : '') + (sk ? ' skip' : '') });
  b.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></svg>';
  return b;
}

/* 編輯輸入共用：Enter 存、Esc 取消、點別處自動存 */
function bindEdit(root, inputs, save, cancel){
  let fin = false;
  const doSave = () => { if(fin) return; fin = true; save(); };
  const doCancel = () => { if(fin) return; fin = true; cancel(); };
  inputs.forEach(i => i.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); doSave(); }
    else if(e.key === 'Escape'){ doCancel(); }

  root.addEventListener('focusout', () => setTimeout(() => { if(!root.contains(document.activeElement)) doSave(); }, 0));
  return doSave;
}

/* 小群組編號：「前綴-兩位數序號」，例如 CP-01、CP-02。前綴依群組名稱自動決定，也可在群組「⋯」裡自訂 */
function prefixOf(g){
  const p = g && g.opts && g.opts.prefix;
  if(p) return p;
  const n = norm(g && g.name);
  if(/camping|露營/.test(n)) return 'CP';
  if(/shopping|購物/.test(n)) return 'SP';
  if(/travel|旅/.test(n)) return 'TV';
  if(/q\s*&\s*a/.test(n)) return 'QA';
  if(/to\s*do/.test(n)) return 'TD';
  const l = (n.match(/[a-z]/g) || []).slice(0, 2).join('').toUpperCase();
  return l.length === 2 ? l : 'GP';
}
const cleanPrefix = v => ((String(v || '').match(/[A-Za-z0-9]+/) || [''])[0]).toUpperCase().slice(0, 4);
const subNum = i => String(i + 1).padStart(2, '0');
const subLabel = (g, i) => prefixOf(g) + '-' + subNum(i);

/* ---------- 多頁：每次露營／旅遊一頁。目前顯示的頁面存在 g.items／opts.tripTitle／opts.notes，其他頁面收在 opts.pages 裡 ---------- */
function pageEntries(g){

  if(!o.pages) return [{ id: 'live', label: lbl(o.tripTitle) }];

}
function ensurePages(g){

  if(!o.pages){ o.curId = uid(); o.pages = [{ id: o.curId }]; }
  g.opts = o; return o;
}
function stashLive(g, o){           // 把目前顯示的頁面收進它自己的紀錄
  const rec = o.pages.find(r => r.id === o.curId);
  if(rec){ rec.title = o.tripTitle || ''; rec.notes = o.notes || ''; rec.cover = o.cover || null; rec.items = g.items; }

function loadPage(g, o, rec){

  if(rec.notes) o.notes = rec.notes; else delete o.notes;

/* ---------- 照片區（標題旁）：每一頁各自一張，傳到 Cloudinary，顯示縮圖，點一下看原圖，可更換／刪除 ---------- */
let coverBusy = false;
const arCache = {};
function coverAR(cv){                                  // 照片的 高／寬（新上傳的記在 cover.ar；舊的先偷偷載一次量出來）
  if(cv.ar) return cv.ar;
  const k = cv.t || cv.u; if(arCache[k]) return arCache[k];
  const im = new Image(); im.onload = () => { if(im.naturalWidth) arCache[k] = im.naturalHeight / im.naturalWidth; }; im.src = k;
  return 0;
}
/* 在背景照片上按住拖曳，調整照片顯示的範圍（位置記在 cover.bx／by，百分比） */
function bindCoverPan(gh, g){
  const okT = ['gthead', 'gtgrid', 'cover', 'gt-a', 'gt-b', 'gt-c', 'gt-d', 'triprow'];
  gh.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(!okT.some(c => e.target.classList.contains(c))) return;           // 只在空白處；按鈕、標題照常操作
    const gg0 = group(g.id), cv = gg0 && gg0.opts && gg0.opts.cover; if(!cv) return;
    const ar = coverAR(cv); if(!ar) return;
    const r = gh.getBoundingClientRect(), iw = Math.max(r.width, r.height / ar), ih = iw * ar;
    const Ex = iw - r.width, Ey = ih - r.height;
    const st = { x: e.clientX, y: e.clientY, bx: cv.bx == null ? 50 : cv.bx, by: cv.by == null ? 50 : cv.by }, cur = { bx: st.bx, by: st.by };
    let moved = false;
    const clamp = v => Math.max(0, Math.min(100, v));
    const mv = ev => {
      const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
      if(!moved && Math.hypot(dx, dy) < 6) return;
      moved = true;
      cur.bx = Ex > 1 ? clamp(st.bx - dx / Ex * 100) : st.bx;
      cur.by = Ey > 1 ? clamp(st.by - dy / Ey * 100) : st.by;
      gh.style.setProperty('--bpx', cur.bx + '%'); gh.style.setProperty('--bpy', cur.by + '%');
    };
    const up = () => {
      document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      if(!moved) return;
      suppressUntil = Date.now() + 400;                                   // 拖曳放開時，不要當成「點一下」去開原圖
      const gg = group(g.id); if(!gg || !gg.opts || !gg.opts.cover) return;
      const o = { ...gg.opts }; o.cover = { ...o.cover, bx: Math.round(cur.bx * 10) / 10, by: Math.round(cur.by * 10) / 10 };
      gg.opts = o; commit(gg);
    };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
}

async function uploadCover(g, file){
  if(!CLOUD_NAME || CLOUD_NAME === 'YOUR_CLOUD_NAME'){ toast('請先在程式裡填入 Cloudinary 的 Cloud name'); return; }
  const cid = (g.opts && g.opts.curId) || '';
  coverBusy = true; render(); toast('照片上傳中…');
  try{
    const blob = await shrink(file);
    const fd = new FormData(); fd.append('file', blob, 'photo.jpg'); fd.append('upload_preset', UPLOAD_PRESET);
    const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', { method: 'POST', body: fd });
    const j = await res.json();
    if(!res.ok || !j.secure_url) throw new Error((j.error && j.error.message) || 'upload failed');
    const gg = group(g.id);
    coverBusy = false;
    if(!gg || ((gg.opts && gg.opts.curId) || '') !== cid){ render(); toast('上傳完成，但你已切換到別頁，照片沒有加入'); return; }
    const o = { ...(gg.opts || {}) };
    o.cover = { u: j.secure_url, t: j.secure_url.replace('/upload/', '/upload/c_limit,w_1200,q_auto,f_auto/'), ar: (j.width && j.height) ? j.height / j.width : undefined };   // 縮圖由 Cloudinary 即時產生
    gg.opts = o; commit(gg); toast('照片已上傳');
  }catch(e){ console.error(e); coverBusy = false; render(); toast('照片上傳失敗：' + (e && e.message ? e.message : '請檢查網路與 Cloudinary 設定')); }
}

    bindEdit(title, [inp], () => { const v = inp.value.trim(), gg = group(view); if(v && gg){ if(norm(v) !== norm(gg.name) && groupNameTaken(v, gg.id)) toast(`已有同名群組「${v}」，名稱未更改`); else { gg.name = v; gg.nameT = Date.now(); } } editing = null; commit(); reconcileIndex(); }, stopEdit);

    title = el('h1', { title: '點兩下（手機：按住再放開）可修改名稱', onclick: () => { if(!blocked() && isDbl('__title')) startEdit(); } }, g.name);
    longPress(title, startEdit);
  }
  /* 上方（標題列＋工具列）固定不動，只有下面的清單內容會捲動 */
  const top = el('div', { class: 'gtop' });
  const backBtn = el('button', { class: 'icon-btn', onclick: () => goto(null), 'aria-label': '返回' }, '‹');
  const moreBtn = el('button', { class: 'icon-btn', onclick: () => openGroupMenu(g), 'aria-label': '群組選項' }, '⋯');
  const pk = isPack(g) && !g.locked;            // 露營／旅遊：標題旁多一塊照片區
  if(!pk) top.append(el('header', {}, backBtn, title, groupBadge(g), moreBtn));

  if(g.locked){ app.append(top, lockPanel(g)); return; }
  const mb = checkBox(0); if(all) mb.classList.add('blue');
  const tbtns = [
    el('button', { class: 'master', onclick: () => setAll(!all), 'aria-pressed': String(all), 'aria-label': all ? '全部取消' : '全選', title: all ? '全部取消' : '全選', disabled: moveMode ? 'disabled' : null }, mb),
    isPack(g) ? '' : el('button', { class: 'btn ghost imp', onclick: pickImport, title: '從 txt 檔匯入', 'aria-label': '從 txt 檔匯入' }, '📥'),
    isPack(g) ? el('button', { class: 'btn ghost imp', onclick: () => openNotes(g), title: 'MEMO', 'aria-label': 'MEMO' }, '📝') : '',
    el('button', { class: 'btn ghost imp undo', onclick: undoLast, disabled: (canUndo(g) && !moveMode) ? null : 'disabled', title: '復原上一次的勾選', 'aria-label': '復原上一個動作' }, '↶'),
    isPack(g) ? el('button', { class: 'btn ghost imp undo', onclick: () => newPageDialog(g), title: '新增一頁：複製目前的小群組與清單，全部恢復未勾選（目前這一頁會保留）', 'aria-label': '新增一頁' }, '🆕') : '',
    isPack(g) ? el('button', { class: 'btn ghost imp undo', onclick: () => openToolMenu(g), title: '更多功能：儲存、匯入、清空勾選、重整、生成網頁、展開／收合、只看未準備', 'aria-label': '更多功能' }, '⋯') : ''];
  const sumEl = el('span', { class: 'sum' + (moveMode ? ' mv' : '') }, moveMode ? `搬移模式　已選 ${moveSel.size} 項` : (total ? `${onlyTodo ? '🔎 只看未準備　' : ''}${isPack(g) ? '已準備' : '已完成'} ${done} / ${total}` : ''));
  if(pk){
    const cvb = (g.opts && g.opts.cover) || null;
    const gh = el('div', { class: 'gthead' + (cvb ? ' hasbg' : '') });                // 照片當成整個標題＋工具列區塊的背景（淡化）
    if(cvb){
      gh.style.setProperty('--cv', 'url("' + String(cvb.t || cvb.u).replace(/"/g, '%22') + '")');
      gh.style.setProperty('--bpx', (cvb.bx == null ? 50 : cvb.bx) + '%'); gh.style.setProperty('--bpy', (cvb.by == null ? 50 : cvb.by) + '%');
      coverAR(cvb); bindCoverPan(gh, g);
    }
    gh.append(el('div', { class: 'gtgrid' },
      el('header', { class: 'gt-a' }, backBtn, title),
      coverBox(g),
      el('div', { class: 'gt-b' }, groupBadge(g), moreBtn),
      el('div', { class: 'toolbar gt-c' }, tbtns),
      el('div', { class: 'gt-d' }, sumEl)),
      tripRow(g));                                                                       // 活動標題列也包在背景裡
    top.append(gh);
  } else top.append(el('div', { class: 'toolbar' }, tbtns, sumEl));
  if(isPack(g) && !pk) top.append(tripRow(g));
  app.append(top);

  if(!g.items.length){
    app.append(el('div', { class: 'empty' }, '還沒有項目。在下方輸入內容按「新增」，要分類就先按「小群組」。'));
  } else {
    const list = el('div', { class: 'list', 'data-container': 'root' });
    let ni = 0, ns = 0;
    g.items.forEach(it => {
      if(isSub(it)){ const lb = subLabel(g, ns), nm = subNum(ns++); if(!onlyTodo || visTodo(it)) list.append(subBlock(it, lb, 0, false, nm)); }
      else { ni++; if(!onlyTodo || visTodo(it)) list.append(itemRow(it, ni)); }      // 編號維持原本的，不因隱藏而變動
    });
    if(onlyTodo && !list.children.length) app.append(el('div', { class: 'empty' }, '🎉 全部都準備好了，沒有未打勾的項目'));
    else app.append(list);
  }
  if(isPack(g) && g.opts && g.opts.notes) app.append(notesBlock(g));
  document.body.append(buildAddBar(g));
}

/* ---------- 露營／旅遊：⋯ 功能選單（儲存、匯入 json、清空勾選、重整、生成網頁、展開／收合）、MEMO ---------- */
function openToolMenu(g){

const subsAllOpen = g => { const subs = allNodes(g.items).filter(isSub); return subs.length > 0 && subs.every(x => !x.collapsed); };
function toggleAllFold(g){
  const gg = group(g.id); if(!gg) return;
  const subs = allNodes(gg.items).filter(isSub);
  if(!subs.length){ toast('還沒有小群組'); return; }

/* 清空：只把所有打勾、灰底框恢復成未打勾，並清掉 MEMO 文字；小群組、清單項目、數量、照片等都完整保留 */
function clearChecks(g){
  const nChk = allNodes(g.items).filter(x => stateOf(x) !== 0).length, hasMemo = !!(g.opts && g.opts.notes);
  if(!nChk && !hasMemo){ toast('目前沒有打勾、灰底的框，也沒有 MEMO'); return; }
  askDelete('清空勾選與 MEMO？',
    `會把 ${nChk} 個打勾／灰底的框恢復成未打勾，並清空 MEMO 文字。你建立的小群組與清單項目完全不會被刪除。建議先按 💾 儲存一份備份。`,
    () => {
      const gg = group(g.id); if(!gg) return;
      allNodes(gg.items).forEach(x => setState(x, 0));
      const o = { ...(gg.opts || {}) }; delete o.notes; gg.opts = o;
      commit(gg); toast('已清空勾選與 MEMO');
    }, '清空');
}
/* 匯入 json：用檔案內容完整取代這個群組的小群組、清單（含打勾／灰底狀態）與 MEMO、活動標題 */
function pickJsonImport(g){
  const inp = el('input', { type: 'file', accept: '.json,application/json', class: 'hide' });
  const done = () => inp.remove();
  inp.addEventListener('cancel', done);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; done();
    if(!f) return;
    let d;
    try{ d = JSON.parse((await f.text()).replace(/^﻿/, '')); }catch(e){ toast('這不是有效的 json 檔'); return; }
    if(!d || !Array.isArray(d.items)){ toast('檔案格式不符，不是這個程式儲存的 json'); return; }
    const fix = arr => arr.every(x => x && typeof x === 'object' && !Array.isArray(x) && (isSub(x) ? (fix(x.items) && x.name != null) : x.text != null));
    if(!fix(d.items)){ toast('檔案內容有誤，無法匯入'); return; }
    const seen = new Set();
    const ids = arr => arr.forEach(x => { if(!x.id || seen.has(x.id)) x.id = uid(); seen.add(x.id); if(isSub(x)) ids(x.items); });
    ids(d.items);
    const lv = leavesOf(d.items).filter(x => !isSub(x)).length, sb = allNodes(d.items).filter(isSub).length;
    const memo = !!(d.opts && d.opts.notes) || !!d.notes;
    askDelete('匯入並還原？',
      `檔案「${f.name}」內有 ${sb} 個小群組、${lv} 個項目${memo ? '，以及 MEMO' : ''}。匯入後，目前這個群組的小群組、清單、勾選狀態與 MEMO 會被檔案內容完全取代（群組名稱與同步代碼不變）。`,
      () => {
        const gg = group(g.id); if(!gg) return;
        const o = { ...(d.opts || {}) };
        if(!o.pages && gg.opts && gg.opts.pages){ o.pages = gg.opts.pages; o.curId = gg.opts.curId; }     // 舊備份沒有多頁資料時，保留目前其他頁面
        if(d.notes && !o.notes) o.notes = d.notes;
        if(d.tripTitle && !o.tripTitle) o.tripTitle = d.tripTitle;
        gg.items = d.items; gg.opts = o;
        for(let i = undoStack.length - 1; i >= 0; i--) if(undoStack[i].gid === gg.id) undoStack.splice(i, 1);
        moveMode = false; moveSel = new Set(); addTarget = '';
        commit(gg); toast('已匯入並還原');
      }, '匯入並取代');
  });
  document.body.append(inp); inp.click();
}
function saveJson(g){
  const o = { ...(g.opts || {}) };
  const title = (o.tripTitle || '').trim();
  const data = { app: 'mylist', version: 1, savedAt: new Date().toISOString(), name: g.name, tripTitle: title, notes: o.notes || '', opts: o, items: g.items };
  const base = (title || g.name || 'list').replace(/[\\\/:*?"<>|\r\n\t]+/g, '_').trim() || 'list';
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: base + '.json', class: 'hide' });
  document.body.append(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
  toast('已儲存：' + base + '.json');
}
function openNotes(g){
  openDialog((f, close) => {
    const ta = el('textarea', { class: 'notes-ta', placeholder: '寫下這次的MEMO…（Enter 可換行）', 'aria-label': 'MEMO' });
    ta.value = (g.opts && g.opts.notes) || '';
    const save = () => {
      const gg = group(g.id); if(!gg){ close(); return; }
      const v = ta.value.replace(/\s+$/, ''), o = { ...(gg.opts || {}) };
      if(v.trim()) o.notes = v; else delete o.notes;
      gg.opts = o; close(); commit(gg);
    };
    f.append(el('h2', {}, 'MEMO'), ta,
      el('div', { class: 'acts' },
        el('button', { class: 'btn ghost', type: 'button', onclick: close }, '取消'),
        el('button', { class: 'btn', type: 'button', onclick: save }, 'SAVE')));
    setTimeout(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 50);
  });
}
function notesBlock(g){
  const box = el('div', { class: 'notes', title: '點兩下（手機：按住再放開）可編輯MEMO', onclick: () => { if(!blocked() && isDbl('__notes')) openNotes(g); } },
    el('h3', {}, '📝 MEMO'), el('div', { class: 'nt' }, g.opts.notes));
  longPress(box, () => openNotes(g));
  return box;
}

function buildAddBar(g){
  const subs = flatSubs(g).map(o => o.s);
  const kind = kindOf(g), hasD = kind !== 'plain', hasA = kind === 'money', hasQ = kind !== 'todo';
  if(!subs.some(s => s.id === addTarget)) addTarget = '';
  let subMode = false;
  const sel = subs.length ? el('select', { class: 'a-sel', 'aria-label': '放入哪個小群組' },
    el('option', { value: '' }, '---'), subOptions(g)) : null;
  if(sel) sel.value = addTarget;
  const modeBtn = el('button', { class: 'btn mode', type: 'button', 'aria-pressed': 'false', title: '建立小群組（下方選單選了某個小群組時，會建立在它裡面）', 'aria-label': '建立小群組' }, '🗂️');
  const name = el('input', { type: 'text', class: 'a-name', enterkeyhint: 'done' });
  const qty = hasQ ? el('input', { type: 'text', class: 'a-qty', inputmode: 'numeric', placeholder: '數量', 'aria-label': '數量' }) : null;
  const date = hasD ? el('input', { type: 'text', class: 'a-date', inputmode: 'numeric', maxlength: '10', placeholder: '日期', title: '西元年月日，例如 20261021', 'aria-label': '日期（西元年月日，例如 20261021）' }) : null;
  const amt = hasA ? el('input', { type: 'text', class: 'a-amt', inputmode: 'decimal', placeholder: '金額', 'aria-label': '金額' }) : null;
  const ok = el('button', { class: 'btn plus', type: 'button', 'aria-label': '新增項目' }, '🟢');
  const subName = () => subs.find(s => s.id === addTarget)?.name;
  function paint(){
    modeBtn.classList.toggle('on', subMode); modeBtn.setAttribute('aria-pressed', String(subMode));
    [qty, date, amt].forEach(x => x && x.classList.toggle('hide', subMode));
    /* 建立小群組時選單仍可選：選了某個小群組＝建立在它裡面（小小群組）；選 --- ＝建立在最上層 */
    ok.setAttribute('aria-label', subMode ? '建立小群組' : '新增項目');
    const ph = subMode ? (addTarget ? `在「${subName()}」裡建立小小群組` : '輸入小群組名稱') : (addTarget ? `新增到「${subName()}」` : '輸入清單內容');
    name.placeholder = ph; name.setAttribute('aria-label', ph);
  }
  const go = () => {
    if(moveMode){ moveSelected(sel ? sel.value : ''); return; }
    const v = name.value; if(!v.trim()) return;
    if(subMode){ addSub(v); return; }
    let extra = null;
    if(hasD){
      const d = parseDate(date.value), a = hasA ? parseAmt(amt.value) : '';
      if(d === null){ toast('日期請輸入 8 碼西元年月日，例如 20261021'); date.focus(); return; }
      if(a === null){ toast('金額請輸入數字'); amt.focus(); return; }
      extra = { date: d, amt: a };
    }
    refocus = true; addItems(addTarget || 'root', v, qty ? qty.value : '', extra);
  };
  modeBtn.addEventListener('click', () => { subMode = !subMode; paint(); name.focus(); });
  if(sel) sel.addEventListener('change', () => { addTarget = sel.value; paint(); });
  ok.addEventListener('click', go);
  [name, qty, date, amt].forEach(i => i && i.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing) go(); }));
  name.addEventListener('paste', e => {
    if(subMode) return;
    const t = (e.clipboardData || window.clipboardData).getData('text');
    if(t.includes('\n')){ e.preventDefault(); refocus = true; addItems(addTarget || 'root', t, ''); }
  });
  function fitSel(){                                   // 選單寬度剛好符合目前選到的文字
    if(!sel) return;
    const m = document.createElement('span');
    m.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:14px;font-family:' + getComputedStyle(document.body).fontFamily;
    m.textContent = sel.selectedOptions[0] ? sel.selectedOptions[0].textContent : '';
    document.body.append(m);
    sel.style.width = Math.ceil(m.getBoundingClientRect().width + 36) + 'px';
    m.remove();
  }
  if(sel) sel.addEventListener('change', fitSel);
  paint(); fitSel();
  /* 由左到右：選單｜Ｇ｜Ｍ｜名稱｜日期｜金額｜數量｜＋（窄螢幕自動折成兩列，順序不變） */
  const moveBtn = sel ? el('button', { class: 'btn mode' + (moveMode ? ' move-on' : ''), type: 'button', 'aria-pressed': String(moveMode), title: '搬移模式：鎖住原有的勾，另外勾選要搬的項目', 'aria-label': '搬移模式', onclick: () => setMoveMode(!moveMode) }, '🔃') : null;
  const brk = () => el('span', { class: 'brk' });
  if(moveMode && sel){                                   // 搬移模式：只留「選單、Ｍ、已選幾項、＋」，避免和新增項目混淆
    modeBtn.disabled = true;
    ok.setAttribute('aria-label', '搬移選取的項目');
    return el('div', { class: 'addbar' }, el('div', { class: 'in' }, [sel, modeBtn, moveBtn, brk(), el('span', { class: 'mvhint' }, `已選 ${moveSel.size} 項，選好目的地後按 🟢 搬移`), ok]));
  }
  const kids = [];
  if(sel) kids.push(sel);
  kids.push(modeBtn);
  if(moveBtn) kids.push(moveBtn);
  if(!hasD && sel) kids.push(brk());             // 一般群組＋有小群組：窄螢幕時名稱欄移到第二列
  kids.push(name);
  if(hasD){ kids.push(brk(), date); if(amt) kids.push(amt); if(qty) kids.push(qty); } else kids.push(qty);
  kids.push(ok);
  return el('div', { class: 'addbar' }, el('div', { class: 'in' }, kids));
}

/* ---------- 匯入 txt（每行「名稱╳數量」，追加到後面，不覆蓋原有內容） ---------- */
function pickImport(){
  const inp = el('input', { type: 'file', accept: '.txt,text/plain', class: 'hide' });
  const done = () => inp.remove();
  inp.addEventListener('cancel', done);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; done();
    if(!f) return;
    try{
      const buf = await f.arrayBuffer();
      let text;
      try{ text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }       // 一般 UTF-8
      catch(e){ text = new TextDecoder('big5').decode(buf); }                    // 記事本舊版「ANSI」存檔
      openImport(text.replace(/^\uFEFF/, ''));
    }catch(e){ console.error(e); toast('讀取檔案失敗'); }
  });
  document.body.append(inp); inp.click();
}
function openImport(text){
  const g = group(view); if(!g) return;
  const all = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean).map(parseLine);
  if(!all.length){ toast('檔案裡沒有內容'); return; }
  const seen = new Set(), lines = [];
  all.forEach(l => { const k = norm(l.text); if(!seen.has(k) && !itemNameTaken(g, l.text)){ seen.add(k); lines.push(l); } });
  const skipped = all.length - lines.length;
  if(!lines.length){ toast('檔案裡的項目都已經存在，沒有可匯入的'); return; }
  const subs = flatSubs(g).map(o => o.s);
  openDialog((f, close) => {
    const dest = el('select', { 'aria-label': '匯入到哪裡' }, el('option', { value: '' }, '最上層（不在小群組）'), subOptions(g));
    dest.value = subs.some(x => x.id === addTarget) ? addTarget : '';
    const peek = lines.slice(0, 3).map(l => l.text + (l.qty ? '×' + l.qty : '')).join('、') + (lines.length > 3 ? '…' : '');
    f.append(el('h2', {}, `匯入 ${lines.length} 個項目`),
      el('p', {}, `新項目會加在「${g.name}」的最後面，原有內容不會被改動。` + (skipped ? `有 ${skipped} 個與現有項目或檔案內重複，會自動略過。` : '')),
      el('p', {}, '開頭幾筆：' + peek));
    if(subs.length) f.append(el('p', {}, '放到：'), dest);
    f.append(el('div', { class: 'acts' },
      el('button', { class: 'btn ghost', type: 'button', onclick: close }, '取消'),
      el('button', { class: 'btn', type: 'button', onclick: () => {
        close();
        const gg = group(view); if(!gg) return;
        const dr = dest.value ? findIn(gg.items, dest.value) : null;
        const target = dest.value ? (dr && isSub(dr.it) ? dr.it.items : null) : gg.items;
        if(!target) return;
        let n = 0;
        lines.forEach(l => { if(!itemNameTaken(gg, l.text)){ target.push({ id: uid(), text: l.text, qty: l.qty, done: false }); n++; } });
        commit(); toast(`已匯入 ${n} 項`);
      } }, '匯入')));
  });
}

/* ---------- 露營／旅遊：小群組 ↑ ↓ 每按一下只移動一格（和同一層的上一個／下一個小群組對調） ---------- */
function moveStep(id, dir){
  const g = group(view); if(!g) return;
  const r = find(g, id); if(!r) return;
  const arr = r.arr, i = arr.indexOf(r.it);
  let j = i + dir;
  while(j >= 0 && j < arr.length && !isSub(arr[j])) j += dir;          // 只和同一層的小群組互換位置
  if(j < 0 || j >= arr.length){ toast(dir < 0 ? '已經在最上面了' : '已經在最下面了'); return; }
  [arr[i], arr[j]] = [arr[j], arr[i]];
  commit();
}
function pinBtns(s, g){
  const mk = (cls, txt, label, fn) => el('span', { class: 'pbtn ' + cls, role: 'button', tabindex: '0', 'aria-label': label, title: label,
    onclick: e => { e.stopPropagation(); if(blocked() || moveMode) return; fn(); },
    onkeydown: e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); if(!moveMode) fn(); } } }, txt);
  return [mk('bot', '↓', '往下移一格', () => moveStep(s.id, 1)), mk('top', '↑', '往上移一格', () => moveStep(s.id, -1))];
}

/* ---------- 重整：有打勾的往上靠齊 → 沒打勾的 → 灰底（不帶）的在最下面；小群組、小小群組、裡面的項目都一樣（同狀態維持原本順序） ---------- */
function orderSnap(g){
  const m = { root: g.items.map(x => x.id) };
  m.__c = {};
  allNodes(g.items).forEach(x => { if(isSub(x)){ m[x.id] = x.items.map(c => c.id); m.__c[x.id] = !!x.collapsed; } });
  return m;
}
function restoreOrder(g, m){
  const map = new Map(allNodes(g.items).map(x => [x.id, x]));
  const re = (arr, ids) => { if(!ids) return; const ord = ids.map(i => map.get(i)).filter(Boolean); if(ord.length === arr.length) arr.splice(0, arr.length, ...ord); };
  re(g.items, m.root);
  allNodes(g.items).forEach(x => { if(isSub(x)){ re(x.items, m[x.id]); if(m.__c && x.id in m.__c) x.collapsed = m.__c[x.id]; } });
}
function tidyGroup(){
  const g = group(view); if(!g || moveMode) return;
  undoStack.push({ gid: g.id, items: [], order: orderSnap(g) });
  if(undoStack.length > 6) undoStack.shift();
  const rank = x => { const s = stateOf(x); return s === 1 ? 0 : s === 0 ? 1 : 2; };
  const sortArr = arr => {
    const subs = arr.filter(isSub), plain = arr.filter(x => !isSub(x)), out = [];
    [0, 1, 2].forEach(r => { out.push(...subs.filter(x => rank(x) === r), ...plain.filter(x => rank(x) === r)); });   // 有打勾：小群組→獨立項目；沒打勾：小群組→獨立項目；灰底：小群組→獨立項目
    arr.splice(0, arr.length, ...out);
    subs.forEach(x => sortArr(x.items));
  };
  sortArr(g.items);
  /* 有未打勾項目的小群組展開；全部都打勾或灰底的小群組收合（自己收起來再重整，有未勾項目的又會被展開） */
  const fold = arr => arr.forEach(x => { if(isSub(x)){ fold(x.items); x.collapsed = !(hasTodo(x) || (!x.items.length && stateOf(x) === 0)); } });
  fold(g.items);
  commit(); toast('已重整：有未勾項目的小群組已展開（可按 ↶ 復原）');
}

/* ---------- 項目照片（imgbb）：每個項目、小群組都可以放不限張數的照片 ---------- */
const imgsOf = it => Array.isArray(it.imgs) ? it.imgs : (it.img ? [it.img] : []);      // 相容舊版只有一張的 img
function setImgs(it, arr){ delete it.img; if(arr.length) it.imgs = arr; else delete it.imgs; }
function picBtn(it){
  const list = imgsOf(it), busy = uploadingId === it.id, out = [];
  const key = fn => e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); fn(); } };
  list.forEach((im, i) => out.push(el('span', { class: 'pic thumb', role: 'button', tabindex: '0', 'aria-label': `查看照片 ${i + 1}/${list.length}`,
    onclick: e => { e.stopPropagation(); if(blocked()) return; openViewer(it.id, i); }, onkeydown: key(() => openViewer(it.id, i)) },
    el('img', { src: im.t || im.u, alt: '', loading: 'lazy' }))));
  out.push(el('span', { class: 'pic add', role: 'button', tabindex: '0', 'aria-label': '上傳照片',
    onclick: e => { e.stopPropagation(); if(blocked() || busy) return; pickPhoto(it.id); }, onkeydown: key(() => { if(!busy) pickPhoto(it.id); }) },
    busy ? '⏳' : '☁️'));
  out[0].classList.add('first');
  return out;
}
function pickPhoto(id){
  const inp = el('input', { type: 'file', accept: 'image/*', multiple: 'multiple', class: 'hide' });
  const done = () => inp.remove();
  inp.addEventListener('cancel', done);
  inp.addEventListener('change', () => { const fs = [...(inp.files || [])]; done(); if(fs.length) uploadPhotos(id, fs); });
  document.body.append(inp); inp.click();
}
async function shrink(file){
  if(!PHOTO_MAX_SIDE) return file;
  try{
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const sc = Math.min(1, PHOTO_MAX_SIDE / Math.max(bmp.width, bmp.height));
    if(sc === 1 && file.type === 'image/jpeg') return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.9));
  }catch(e){ return file; }
}
async function uploadPhotos(id, files){
  const gid = view;
  uploadingId = id; render();
  let ok = 0;
  for(let i = 0; i < files.length; i++){
    toast(files.length > 1 ? `照片上傳中（${i + 1}/${files.length}）…` : '照片上傳中…');
    try{
      const blob = await shrink(files[i]);
      if(!CLOUD_NAME || CLOUD_NAME === 'YOUR_CLOUD_NAME'){ toast('請先在程式裡填入 Cloudinary 的 Cloud name'); break; }
      const fd = new FormData(); fd.append('file', blob, 'photo.jpg'); fd.append('upload_preset', UPLOAD_PRESET);
      const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', { method: 'POST', body: fd });
      const j = await res.json();
      if(!res.ok || !j.secure_url) throw new Error((j.error && j.error.message) || 'upload failed');
      const g = group(gid), r = g && find(g, id);
      if(!r) break;
      const thumb = j.secure_url.replace('/upload/', '/upload/c_fill,w_60,h_60,q_auto,f_auto/');   // 縮圖由 Cloudinary 即時產生
      setImgs(r.it, [...imgsOf(r.it), { u: j.secure_url, t: thumb, d: '' }]);
      ok++; commit(g);                                   // 每傳完一張就存起來，中途失敗也不會掉
    }catch(e){ console.error(e); toast(`第 ${i + 1} 張上傳失敗：` + (e && e.message ? e.message : '請檢查網路後再試')); break; }
  }
  uploadingId = null; render();
  if(ok) toast(`已上傳 ${ok} 張照片`);
}
const uploadPhoto = (id, file) => uploadPhotos(id, [file]);
function openViewer(id, idx = 0){
  const list = () => { const r = find(group(view), id); return r ? imgsOf(r.it) : []; };
  const r0 = find(group(view), id); if(!r0 || !list().length) return;
  const label = r0.it.text || r0.it.name;
  let i = Math.min(idx, list().length - 1);
  const img = el('img', { alt: label });
  const box = el('div', { class: 'vbox' }, img);
  const vt = el('span', { class: 'vt' }), foot = el('div', { class: 'vfoot' });
  const ov = el('div', { class: 'viewer', role: 'dialog', 'aria-label': '照片' });
  const onKey = e => { if(e.key === 'Escape') close(); else if(e.key === 'ArrowLeft') step(-1); else if(e.key === 'ArrowRight') step(1); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const prev = el('button', { class: 'btn ghost vb', type: 'button', 'aria-label': '上一張', onclick: () => step(-1) }, '‹');
  const next = el('button', { class: 'btn ghost vb', type: 'button', 'aria-label': '下一張', onclick: () => step(1) }, '›');
  function show(){
    const L = list(); if(!L.length){ close(); return; }
    i = Math.max(0, Math.min(i, L.length - 1));
    img.src = L[i].u;
    vt.textContent = label + (L.length > 1 ? `（${i + 1}/${L.length}）` : '');
    prev.classList.toggle('hide', L.length < 2); next.classList.toggle('hide', L.length < 2);
    foot.replaceChildren('點照片可切換「符合螢幕」與「原始大小」' + (L.length > 1 ? '，左右滑動換張' : ''),
      L[i].d ? el('span', {}, '　·　', el('a', { href: L[i].d, target: '_blank', rel: 'noopener' }, 'imgbb 刪除頁 ↗')) : '');
  }
  function step(d){ const L = list(); if(L.length < 2) return; i = (i + d + L.length) % L.length; show(); }
  document.addEventListener('keydown', onKey);
  img.addEventListener('click', e => { e.stopPropagation(); box.classList.toggle('full'); });
  box.addEventListener('click', e => { if(e.target === box) close(); });
  let tx = null;                                            // 手機左右滑動換張（放大成原始大小時不啟用，避免和捲動衝突）
  box.addEventListener('touchstart', e => { tx = box.classList.contains('full') ? null : e.touches[0].clientX; }, { passive: true });
  box.addEventListener('touchend', e => { if(tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if(Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });
  const del = () => askDelete('刪除這張照片？',
    '照片會從這個項目移除。' + (list()[i] && list()[i].d ? '如果也要從 imgbb 帳號徹底刪除，請先關閉這個視窗，再按照片下方的「imgbb 刪除頁」。' : ''),
    () => { const r2 = find(group(view), id); if(r2){ const L = imgsOf(r2.it).slice(); L.splice(i, 1); setImgs(r2.it, L); commit(); } show(); });
  ov.append(
    el('div', { class: 'vbar' }, vt, prev, next,
      el('button', { class: 'btn warn vb', type: 'button', onclick: del }, 'DEL'),
      el('button', { class: 'btn ghost vb', type: 'button', onclick: close, 'aria-label': '關閉' }, '✕')),
    box, foot);
  show();
  document.body.append(ov);
}

/* ---------- 生成網頁（A4 列印版） ----------
   標題＝活動標題（沒填就用群組名稱）；下方分隔線；小群組與項目全部展開，用多欄「先往下、滿了再往右」排進一張 A4。
   左上角三段按鈕：□ 只列沒打勾的（空白清單）／■ 全部（預設）／☑ 只列有打勾的。 */
const PV_SVG = '<svg viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7"/></svg>';
const PV_MODES = ['□　只列「沒打勾」的項目（空白清單）', '■　顯示全部（有打勾＋沒打勾）', '☑　只列「有打勾」的項目'];
let pvMode = 1;
function closePrintView(){ const o = $('#pv'); if(o) o.remove(); document.removeEventListener('keydown', pvKey); }
function pvKey(e){ if(e.key === 'Escape') closePrintView(); }
function buildSheet(g, sheet, mode){
  sheet.innerHTML = '';
  sheet.style.zoom = '';
  const kd = kindOf(g);
  const want = x => { const s = stateOf(x); return mode === 0 ? s === 0 : mode === 2 ? s === 1 : true; };
  const mkBox = x => {
    const s = mode === 0 ? 0 : stateOf(x);
    const b = el('span', { class: 'pv-box' + (s === 1 ? ' st1' : s === 2 ? ' st2' : '') });
    if(s === 1) b.innerHTML = PV_SVG;
    return b;
  };
  const mkRow = it => {
    const metas = [];
    if(kd !== 'plain' && it.date) metas.push(el('span', { class: 'pv-meta' }, it.date));
    if(kd === 'money' && it.amt !== undefined && it.amt !== '') metas.push(el('span', { class: 'pv-meta' }, fmtAmt(it.amt)));
    return el('div', { class: 'pv-row' }, mkBox(it), el('span', { class: 'pv-t' }, it.text, metas),
      kd !== 'todo' && it.qty ? el('span', { class: 'pv-q' }, el('span', { class: 'pv-need' }, mode === 0 ? '' : String((it.need !== undefined && it.need !== '' && it.need != null) ? it.need : it.qty)), ' / ' + it.qty) : '');
  };
  const cv = g.opts && g.opts.cover;
  const photo = (cv && cv.pshow !== false) ? buildPhoto(g, cv) : '';            // 標題上方的照片區（可拖曳位置、調整大小）
  const head = el('div', { class: 'pv-head' }, photo, el('h1', {}, (g.opts && g.opts.tripTitle) || g.name), el('hr'));
  const cols = el('div', { class: 'pv-cols' });
  let si = 0;
  const subEl = (s, label, num, depth) => {
    const kids = []; let k = 0;
    s.items.forEach(c => {
      if(isSub(c)){ const e = subEl(c, num + '-' + (++k), num, depth + 1); if(e) kids.push(e); }
      else if(want(c)) kids.push(mkRow(c));
    });
    if(!kids.length && !want(s)) return null;
    const h = subHue(s);
    return el('div', { class: 'pv-g' + (depth ? ' pv-gg' : '') },
      el('div', { class: 'pv-sub', style: `background:hsl(${h} 55% 90%);border-left-color:hsl(${h} 45% 50%)` }, mkBox(s), el('span', { class: 'pv-code' }, label), el('span', { class: 'pv-t' }, s.name)),
      kids);
  };
  g.items.forEach(it => {
    if(isSub(it)){
      const label = subLabel(g, si), num = subNum(si); si++;
      const e = subEl(it, label, num, 0); if(e) cols.append(e);
    } else if(want(it)){
      cols.append(mkRow(it));
    }
  });
  if(!cols.children.length) cols.append(el('div', { class: 'pv-none' }, '（沒有符合的項目）'));
  sheet.append(head, cols);
}
/* 列印頁的照片：固定高度的版面框（190mm × 55mm），照片可在框內拖曳移動、用滑桿縮放；位置與大小記在 opts.cover，下次開啟還是一樣 */
function savePhotoLayout(gid, lay){
  const gg = group(gid); if(!gg || !gg.opts || !gg.opts.cover) return;
  const o = { ...gg.opts }; o.cover = { ...o.cover, ps: lay.ps, px: lay.px };
  gg.opts = o; commit(gg);
}
function refitSheet(sh){ const z = sh.style.zoom; sh.style.zoom = ''; fitSheet(sh); sh.style.zoom = z; }   // 照片高度改變時，重新計算清單的欄數與字級
function buildPhoto(g, cv){
  const W = 190, MAXH = 80;                                                 // 內容寬度、照片最高（mm）
  const lay = { ps: cv.ps || 1, px: cv.px };
  const frame = el('div', { class: 'pv-photo' });
  const img = el('img', { src: cv.u, alt: '', draggable: 'false' });
  frame.append(img); frame._lay = lay;
  const arOf = () => cv.ar || (img.naturalWidth ? img.naturalHeight / img.naturalWidth : 0.75);
  const calc = () => {
    const ar = arOf(), wmm = Math.min(W, MAXH / ar) * Math.max(0.2, Math.min(1, lay.ps));   // 100% ＝ 寬度或高度其中一邊到頂
    return { w: wmm / W, h: wmm * ar };
  };
  frame._apply = () => {
    const d = calc();
    lay.px = Math.max(0, Math.min(1 - d.w, lay.px == null ? (1 - d.w) / 2 : lay.px));
    img.style.left = (lay.px * 100) + '%'; img.style.width = (d.w * 100) + '%';
    frame.style.height = d.h.toFixed(2) + 'mm';                             // 框的高度＝照片高度，清單就會緊貼在照片下方
  };
  frame._scale = v => {                                                     // 縮放時以照片中心為準
    const o = calc(), cx = (lay.px == null ? (1 - o.w) / 2 : lay.px) + o.w / 2;
    lay.ps = v; const n = calc(); lay.px = cx - n.w / 2; frame._apply();
  };
  img.addEventListener('load', () => { frame._apply(); const sh = frame.closest('.pv-sheet'); if(sh && !cv.ar) refitSheet(sh); });
  img.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ img.setPointerCapture(e.pointerId); }catch(x){}
    const r = frame.getBoundingClientRect(), st = { x: e.clientX, px: lay.px };
    img.classList.add('drag');
    const mv = ev => { lay.px = st.px + (ev.clientX - st.x) / r.width; frame._apply(); };
    const up = () => {
      img.removeEventListener('pointermove', mv); img.removeEventListener('pointerup', up); img.removeEventListener('pointercancel', up);
      img.classList.remove('drag'); savePhotoLayout(g.id, lay);
    };
    img.addEventListener('pointermove', mv); img.addEventListener('pointerup', up); img.addEventListener('pointercancel', up);
  });
  frame._apply();
  return frame;
}
function buildMemo(g, memo){
  const t = (g.opts && g.opts.notes) || '';
  memo.innerHTML = ''; memo.style.zoom = '';
  memo.classList.toggle('hide', !t.trim());
  if(!t.trim()) return;
  memo.append(el('div', { class: 'pv-head' }, el('h1', {}, (g.opts && g.opts.tripTitle) || g.name), el('hr')),
    el('div', { class: 'pv-memo-h' }, 'MEMO'), el('div', { class: 'pv-memo-t' }, t));
}
function fitSheet(sheet){
  const cols = sheet.querySelector('.pv-cols'), head = sheet.querySelector('.pv-head');
  const mm = 96 / 25.4;
  const limit = 277 * mm - head.offsetHeight - 14;           // A4 高 297mm，扣掉上下各 10mm 邊界
  const trySizes = [12, 11, 10, 9];
  for(const sz of trySizes){
    for(let n = 2; n <= 5; n++){
      sheet.style.setProperty('--pvf', sz + 'px'); cols.style.columnCount = n;
      if(cols.offsetHeight <= limit) return;                // 用最少的欄數、最大的字放得進一頁
    }
  }
}
function openPrintView(g){

  };
  mbtn.addEventListener('click', () => { pvMode = (pvMode + 1) % 3; paint(); rebuild(); });   // □ → ■ → ☑ → □
  const ov = el('div', { id: 'pv', role: 'dialog', 'aria-label': '列印預覽' },
    el('div', { class: 'pv-bar' }, mbtn, cap,
      el('button', { class: 'btn', type: 'button', onclick: () => window.print(), 'aria-label': '列印' }, '🖨️ 列印'),
      el('button', { class: 'btn ghost', type: 'button', onclick: closePrintView, 'aria-label': '關閉' }, '✕')),
