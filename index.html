<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的清單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface2:#f4f7f9; --ink:#1d2b36; --muted:#6b7c89; --line:#d9e1e7;
  --accent:#1f6f8b; --accent-ink:#ffffff; --done:#9aa8b2; --danger:#c0392b; --tick:#2e9e6b;
  --sub:#dcf1e3; --sub-soft:#f1faf4; --sub-line:#7cc596;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#10171c; --surface:#18222a; --surface2:#1d2a33; --ink:#e6edf2; --muted:#8a9aa6; --line:#2a3842; --accent:#4fb0cf; --accent-ink:#0c1a21; --done:#5d6e7a; --danger:#ff7a6b; --tick:#43c48a; --sub:#1e3d2e; --sub-soft:#172a21; --sub-line:#3f8f64;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5;
  touch-action:manipulation;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 150px}
header{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
header h1{font-size:22px;margin:0;flex:1;font-weight:700;letter-spacing:.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:text;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.icon-btn:focus-visible,.btn:focus-visible,input:focus-visible,.row:focus-visible,.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:0 14px;height:44px;font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.warn{background:var(--danger);color:#fff}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;background:none;border:0;padding:4px}
.sync.home{cursor:default}
.lock{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center}
.lock .lk{font-size:38px;line-height:1;margin-bottom:8px}
.lock p{margin:6px 0 12px}
.lock .hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--done)}
.dot.on{background:var(--tick)} .dot.busy{background:#e0a528} .dot.err{background:var(--danger)}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;flex:1;min-width:0;user-select:text;-webkit-user-select:text}
.title-in{font-size:20px;font-weight:700;flex:1}

/* home */
.group{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px 10px;margin-bottom:6px}
.group{cursor:pointer}
.group .top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.group .name{flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px 2px;margin-bottom:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 0 2px}
.tile .wrap52{position:relative;width:52px;height:52px}
.tile .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;position:relative;overflow:hidden}
.tile .ico i{position:absolute;left:0;bottom:0;height:4px;background:rgba(255,255,255,.9)}
.tile .nm{font-size:12px;text-align:center;max-width:78px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;line-height:1.3}
.tile .ct{font-size:11px;color:var(--muted);margin-top:-3px}
.badge{position:absolute;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.badge::after{content:"";position:absolute;inset:-6px}
.badge.l{left:-8px}.badge.r{right:-8px}
.group .name{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.group .cnt{color:var(--muted);font-size:14px;white-space:nowrap}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tick);width:0;transition:width .25s}
.add-group{display:flex;gap:8px;margin:0 0 12px}
.btn.plus{width:44px;padding:0;font-size:24px;line-height:1}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:14px;margin-bottom:12px}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:12px;margin:0 2px 10px;min-height:40px}
.master{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 14px 0 10px;height:40px;font-size:14px}
.toolbar .sum{color:var(--muted);font-size:14px;margin-left:auto}

/* list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:0 2px 0 12px;min-height:36px;border-bottom:1px solid var(--line);cursor:pointer;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--surface)}
.list>.row:last-child,.children>.row:last-child{border-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;background:transparent;padding:0}
.box svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:all .12s}
.on>.box,.box.on{background:var(--tick);border-color:var(--tick)}
.on>.box svg,.box.on svg{opacity:1;transform:scale(1)}
.num{flex:none;color:var(--muted);font-size:12px;min-width:1.8em;text-align:right;font-variant-numeric:tabular-nums}
.txt{flex:1;padding:7px 0;font-size:12px;overflow-wrap:anywhere;min-width:0}
.qty{flex:none;min-width:2.4em;text-align:right;color:var(--muted);padding:7px 2px;font-size:12px;font-variant-numeric:tabular-nums}
.qty:empty{display:none}
.row.done .txt{color:var(--done);text-decoration:line-through}
.row.done .qty{color:var(--done)}
.mini{flex:none;background:none;border:0;color:var(--muted);width:34px;height:36px;font-size:15px;border-radius:10px;opacity:.55;padding:0}
.mini:hover{opacity:1}
.del{font-size:17px}
.sub{border-bottom:1px solid var(--line)}
.list>.sub:last-child{border-bottom:0}
.subhead{background:var(--sub);font-weight:500}
.subhead .cnt{flex:none;color:var(--muted);font-size:12px;font-weight:400}
.subhead .txt{font-size:13px}
.children{margin-left:18px;border-left:3px solid var(--sub-line);background:var(--sub-soft)}
.children:empty{border-left:0}
.children .row{padding-left:8px;background:transparent}
body.drag-item .children{min-height:40px}
.sub.hot>.subhead{outline:2px solid var(--tick);outline-offset:-2px}
.sub.hot>.children{background:var(--sub)}
.mvline{flex:1 1 100%;display:flex;align-items:center;gap:8px;padding-left:38px;font-size:14px;color:var(--muted)}
.mvline select{flex:1;min-width:0;height:38px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.addform{display:flex;gap:8px;align-items:center}
.addform input{height:40px}
.a-qty,.e-qty{flex:none!important;width:62px;text-align:center;min-width:0}
.e-qty{width:62px}
.addform .btn{height:40px;padding:0 12px;font-size:14px}
.row.editing{flex-wrap:wrap;cursor:default;gap:8px;padding:6px 8px 6px 12px;user-select:text;-webkit-user-select:text}
.row.editing input{height:40px}
.ok{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;width:40px;height:40px;font-size:18px;flex:none}
.addbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0))}
.addbar .in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ctl,.line{display:flex;gap:8px;align-items:center}
.ctl select{flex:1;min-width:0;height:40px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.ctl .btn,.line .btn{height:40px;padding:0 14px;font-size:14px}
.btn.mode{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.mode.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.line input[type=text]{height:44px}
.line .a-qty{height:44px}
.line .btn{height:44px}
.btn[disabled]{opacity:.4}
@media (min-width:700px){.addbar .in{flex-direction:row;align-items:center}.addbar .ctl{flex:none;width:280px}.addbar .line{flex:1}}

/* drag */
.placeholder{opacity:.35;background:var(--surface2)}
.dragghost{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.28);opacity:.96;overflow:hidden}

dialog{border:0;border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 8px;font-size:18px}
dialog p{margin:6px 0 12px;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
dialog .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
dialog .acts .btn{height:36px;padding:0 16px;font-size:14px;border-radius:9px}
dialog input{width:100%}
dialog select{width:100%;height:40px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.toolbar .imp{height:40px;padding:0 14px;font-size:14px}
.hide{display:none!important}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* 每個群組、小群組各自的底色（色相隨機；沒有分組的項目維持原樣） */
.sub{--sub:hsl(var(--h,140) 55% 88%);--sub-soft:hsl(var(--h,140) 60% 94%);--sub-line:hsl(var(--h,140) 45% 62%)}
.group{background:hsl(var(--h,200) 55% 95%);border-color:hsl(var(--h,200) 40% 82%)}
@media (prefers-color-scheme: dark){
  .sub{--sub:hsl(var(--h,140) 32% 23%);--sub-soft:hsl(var(--h,140) 28% 16%);--sub-line:hsl(var(--h,140) 35% 42%)}
  .group{background:hsl(var(--h,200) 28% 17%);border-color:hsl(var(--h,200) 25% 28%)}
}
/* 項目照片（☁️ 上傳、10×10 縮圖、點開看大圖） */
.pic{display:inline-flex;align-items:center;justify-content:center;position:relative;width:20px;height:28px;margin-left:1.6em;vertical-align:middle;font-size:14px;line-height:1;cursor:pointer;opacity:.75}
.pic::after{content:"";position:absolute;inset:-4px -8px}
.pic:hover,.pic:focus-visible{opacity:1}
.pic img{width:10px;height:10px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px var(--line);display:block}
.viewer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:flex;flex-direction:column;color:#fff}
.vbar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.vbar .vt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .vb{height:36px;padding:0 14px;font-size:14px;border-radius:9px}
.vbox{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:8px}
.vbox img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;cursor:zoom-in}
@supports (height:100dvh){.vbox img{max-height:calc(100dvh - 150px)}}
.vbox.full{display:block}
.vbox.full img{max-width:none;max-height:none;cursor:zoom-out}
.vfoot{padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:#b8c4cc}
.vfoot a{color:#9fd3ff}
/* 日期／金額欄位（只在有開啟的群組出現） */
.line2{display:flex;gap:8px;align-items:center}
.line2 input{height:40px;flex:1;min-width:0}
.line2 .a-date{flex:1.6}
.meta{display:inline-block;font-size:8px;color:var(--muted);margin-left:6px;white-space:nowrap;vertical-align:baseline}
.wrap.tall{padding-bottom:200px}
.mvline input{flex:1;min-width:0;height:38px;font-size:16px}
dialog label.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:14px;color:var(--ink)}
dialog input[type=checkbox]{width:18px;height:18px;flex:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ Firebase 設定（之後貼上你的設定） ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZnudTiv8p3QjOFzU31bGTGXi75-eeMVs",
  authDomain: "mylist-ac778.firebaseapp.com",
  projectId: "mylist-ac778",
  storageBucket: "mylist-ac778.firebasestorage.app",
  messagingSenderId: "173776942369",
  appId: "1:173776942369:web:fb3d5fed45fe5b3ccdfa60"
};
/* =========================================================== */

const LS_DATA = 'mylists-v1', LS_CODE = 'mylists-sync-code';
const IMGBB_KEY = '3e63e52100d718b4fe1b7f8be452fd15';   // 項目照片上傳到 imgbb
const PHOTO_MAX_SIDE = 2400;                            // 照片長邊上限（px），上傳前先縮小以加快速度；設 0 = 不縮小
const INDEX_ID = '_group_index';   // 群組清單（只有名稱，不含內容）放在這份雲端文件
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const $ = s => document.querySelector(s);

/* 資料結構
   state.groups = [{ id, name, items:[ 項目 或 小群組 ] }]
   項目   = { id, text, qty, done }
   小群組 = { id, name, items:[項目...], collapsed, done }   (有 items 陣列就是小群組)  */
let state = load();
/* 記住畫面狀態：重新整理後回到原本開著的群組、捲動位置、選好的小群組 */
const LS_UI = 'mylists-ui';
let ui = (() => { try{ return JSON.parse(localStorage.getItem(LS_UI)) || {}; }catch(e){ return {}; } })();
const saveUI = () => { try{ localStorage.setItem(LS_UI, JSON.stringify(ui)); }catch(e){} };
let view = (ui.view && state.groups.some(g => g.id === ui.view)) ? ui.view : null;   // 目前開啟的大群組 id
let editing = null;              // { id, field:'text'|'qty' }，id='__title' 代表群組標題
let refocus = false, undoSnap = null, pendingRender = false;
let addTarget = (view && ui.t && ui.t[view]) || '', uploadingId = null;
let homeView = localStorage.getItem('mylists-homeview') || 'list';
let db = null;

function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_DATA)); if(d && Array.isArray(d.groups)){ d.deleted = d.deleted || []; return d; } }catch(e){}
  return { groups: [], deleted: [], updatedAt: 0 };
}
function commit(g){
  g = g || (view ? group(view) : null);
  const now = Date.now();
  if(g) g.updatedAt = now;
  state.updatedAt = now;
  saveLocal();
  render();
  if(g) pushSoon(g);
}
const group = id => state.groups.find(g => g.id === id);
const appTitle = () => state.title || '我的清單';
/* 手機：按住標題、放開後進入修改（和電腦的「點兩下」並存） */
function longPress(node, fn, ms = 450){
  let t = null, armed = false, sx = 0, sy = 0;
  const clear = () => { clearTimeout(t); t = null; armed = false; };
  node.addEventListener('pointerdown', e => {
    if(e.pointerType === 'mouse') return;
    sx = e.clientX; sy = e.clientY; armed = false;
    t = setTimeout(() => { armed = true; if(navigator.vibrate) navigator.vibrate(10); }, ms);
  });
  node.addEventListener('pointermove', e => { if((t || armed) && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) clear(); });
  node.addEventListener('pointerup', () => { const go = armed; clear(); if(go){ suppressUntil = Date.now() + 500; fn(); } });
  node.addEventListener('pointercancel', clear);
  node.addEventListener('contextmenu', e => e.preventDefault());
}
const isSub = it => Array.isArray(it.items);
const subDone = s => s.items.length ? s.items.every(i => i.done) : !!s.done;
function leaves(g){
  const out = [];
  g.items.forEach(it => { if(isSub(it)){ if(it.items.length) out.push(...it.items); else out.push(it); } else out.push(it); });
  return out;
}
function find(g, id){
  for(const it of g.items){
    if(it.id === id) return { it, arr: g.items };
    if(isSub(it)){ const c = it.items.find(x => x.id === id); if(c) return { it: c, arr: it.items }; }
  }
  return null;
}
function parseDate(v){            // '' = 沒填；null = 格式不對；否則回傳 8 碼 YYYYMMDD
  const d = String(v || '').replace(/\D/g, '');
  if(!d) return '';
  if(d.length === 8){ const mo = +d.slice(4, 6), da = +d.slice(6, 8); if(mo >= 1 && mo <= 12 && da >= 1 && da <= 31) return d; }
  return null;
}
function parseAmt(v){             // '' = 沒填；null = 不是數字
  const t = String(v || '').replace(/[,，\s]/g, '');
  if(!t) return '';
  return /^\d{1,9}(\.\d{1,2})?$/.test(t) ? Number(t) : null;
}
const fmtAmt = v => Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
const cleanQty = v => { const s = String(v ?? '').replace(/\D/g, '').slice(0, 5); return s === '' ? '' : Number(s); };

/* ---------- 同步（每個群組各自一組代碼；有代碼才會上雲端） ---------- */
const configured = () => !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const unsubs = {}, timers = {}, gstat = {};
const cleanCode = v => String(v || '').trim().replace(/[\/\s]/g, '');
const saveLocal = () => localStorage.setItem(LS_DATA, JSON.stringify(state));
const kind = s => s === 'on' ? 'on' : s === 'busy' ? 'busy' : s === 'err' ? 'err' : '';
function ensureDb(){
  if(db) return db;
  if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try{ db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); }catch(e){}   // 離線時的修改會排隊，連線後自動補傳
  return db;
}
function groupStatusText(g){ return g.code ? ({ on: '已同步', busy: '同步中', err: '同步失敗', off: '未連線' }[gstat[g.id] || 'off']) : '未同步'; }
function aggregate(){
  const coded = state.groups.filter(g => g.code);
  if(!configured() || !coded.length) return { k: '', t: '僅存本機' };
  const st = coded.map(g => gstat[g.id] || 'off');
  if(st.includes('err')) return { k: 'err', t: '同步失敗' };
  if(st.includes('busy') || st.includes('off')) return { k: 'busy', t: '同步中…' };
  return { k: 'on', t: '已同步' };
}
function refreshBadges(){
  const h = $('.sync.home');
  if(h){ const a = aggregate(); h.querySelector('.dot').className = 'dot ' + a.k; h.querySelector('span').textContent = a.t; }
  const gb = $('.sync.gsync'), g = view && group(view);

/* ---------- 群組清單同步（不需代碼；只同步「有哪些群組、叫什麼」） ---------- */
let reconciling = false, reAgain = false;
function mergeIndex(remote, rmeta = {}){
  const map = new Map(remote.map(e => [e.id, { ...e }]));
  let changed = false;
  (state.deleted || []).forEach(id => {
    const e = map.get(id);
    if(!e || !e.del){ map.set(id, { id, del: true, t: Date.now() }); changed = true; }
  });
  state.groups.forEach(g => {
    const e = map.get(g.id);
    if(!e || (e.del && g.revive)){
      g.nameT = g.nameT || Date.now(); g.revive = false;
      map.set(g.id, { id: g.id, name: g.name, t: g.nameT }); changed = true;
    } else if(!e.del && (g.nameT || 0) > (e.t || 0)){
      e.name = g.name; e.t = g.nameT; changed = true;
    }
  });
  if(state.title && !state.titleT) state.titleT = Date.now();            // 舊版就有的標題，視為剛設定
  let meta = { title: rmeta.title || '', titleT: rmeta.titleT || 0 };
  if((state.titleT || 0) > meta.titleT){ meta = { title: state.title || '', titleT: state.titleT }; changed = true; }
  return { list: [...map.values()], meta, changed };
}
function applyIndex(list, meta = {}){
  let dirty = false;
  if((meta.titleT || 0) > (state.titleT || 0)){ state.title = meta.title || ''; state.titleT = meta.titleT; dirty = true; }
  list.forEach(e => {
    const g = group(e.id);
    if(e.del){
      if(g){ stopListen(g.id); state.groups = state.groups.filter(x => x.id !== g.id); if(view === g.id) view = null; dirty = true; }
      return;
    }
    if(!g){ state.groups.push({ id: e.id, name: e.name, items: [], code: '', updatedAt: 0, locked: true, nameT: e.t || 0 }); dirty = true; }
    else if((e.t || 0) > (g.nameT || 0)){ g.name = e.name; g.nameT = e.t; dirty = true; }
  });
  return dirty;
}
async function reconcileIndex(){
  if(!configured()) return;
  if(reconciling){ reAgain = true; return; }
  reconciling = true;
  try{
    const database = ensureDb(), ref = database.collection('checklists').doc(INDEX_ID);
    const sent = new Set(state.deleted || []);
    let merged = { list: [], meta: {} };
    await database.runTransaction(async tx => {
      const snap = await tx.get(ref);
      let remote = [];
      let rmeta = {};
      if(snap.exists){ try{ const j = JSON.parse(snap.data().json); remote = j.groups || []; rmeta = { title: j.title, titleT: j.titleT }; }catch(e){} }
      const r = mergeIndex(remote, rmeta);
      merged = r;
      if(r.changed || !snap.exists) tx.set(ref, { json: JSON.stringify({ groups: r.list, title: r.meta.title, titleT: r.meta.titleT }), updatedAt: Date.now() });
    });
    state.deleted = (state.deleted || []).filter(id => !sent.has(id));
    const dirty = applyIndex(merged.list, merged.meta);
    saveLocal();
    if(dirty && !editing) render();
  }catch(e){ console.error('群組清單同步失敗', e); }
  finally{ reconciling = false; if(reAgain){ reAgain = false; reconcileIndex(); } }
}
function startIndex(){
  if(!configured()) return;
  try{
    ensureDb().collection('checklists').doc(INDEX_ID).onSnapshot(snap => { if(!snap.metadata.hasPendingWrites) reconcileIndex(); }, e => console.error(e));
  }catch(e){ console.error(e); }
  reconcileIndex();
  window.addEventListener('online', reconcileIndex);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') reconcileIndex(); });
}

/* ---------- 操作 ---------- */
/* 名稱不可重複（不分大小寫、全半形、前後空白） */
const norm = x => String(x || '').normalize('NFKC').trim().replace(/\s+/g, ' ').toLowerCase();
const groupNameTaken = (name, exceptId) => state.groups.some(x => x.id !== exceptId && norm(x.name) === norm(name));
const subNameTaken = (g, name, exceptId) => g.items.some(x => isSub(x) && x.id !== exceptId && norm(x.name) === norm(name));
const itemNameTaken = (g, name, exceptId) => g.items.some(x => isSub(x) ? x.items.some(c => c.id !== exceptId && norm(c.text) === norm(name)) : (x.id !== exceptId && norm(x.text) === norm(name)));
function addGroup(name){ name = name.trim(); if(!name) return; if(groupNameTaken(name)){ toast(`已有同名群組「${name}」（大小寫視為相同）`); return; } state.groups.push({ id: uid(), name, items: [], nameT: Date.now() }); commit(); reconcileIndex(); }
function renameGroup(id, name){ name = name.trim(); const g = group(id); if(g && name && norm(name) !== norm(g.name) && groupNameTaken(name, id)){ toast(`已有同名群組「${name}」，名稱未更改`); return; } if(g && name){ g.name = name; g.nameT = Date.now(); commit(g); reconcileIndex(); } }
function deleteGroup(id){ stopListen(id); state.groups = state.groups.filter(g => g.id !== id); state.deleted = [...(state.deleted || []), id]; view = null; commit(); reconcileIndex(); }
/* 「名稱╳數量」→ 名稱 + 數量（支援 ╳ × ✕ ，數量可用全形數字，後面可接 顆／個／支…；╳ 後面沒數字就當作沒有數量） */
const QTY_RE = /(?:\s*[╳×✕]\s*([0-9０-９]*)|\s+[xX]\s*([0-9０-９]+))\s*(?:顆|個|支|組|條|包|瓶|罐|隻|張|件|只|片|把|盒)?\s*$/;
function parseLine(t){
  t = t.trim();
  const m = t.match(QTY_RE);
  if(!m) return { text: t, qty: '' };
  const name = t.slice(0, m.index).trim();
  if(!name) return { text: t, qty: '' };
  const d = (m[1] || m[2] || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248));
  return { text: name, qty: d ? cleanQty(d) : '' };
}
function addItems(key, raw, qtyRaw, extra){
  const g = group(view); if(!g) return;
  const target = key === 'root' ? g.items : g.items.find(x => x.id === key)?.items;
  if(!target) return;
  const multi = /\r?\n/.test(raw);                     // 多行貼上：只用換行分隔（名稱裡的頓號不會被拆開）
  const parts = (multi ? raw.split(/\r?\n/) : raw.split(/、|，|,/)).map(x => x.trim()).filter(Boolean);
  if(!parts.length) return;
  let added = 0; const dup = [];
  parts.forEach(p => {
    const r = parseLine(p);
    if(itemNameTaken(g, r.text)){ dup.push(r.text); return; }
    let q = r.qty;
    if(parts.length === 1 && q === '') q = cleanQty(qtyRaw);
    const item = { id: uid(), text: r.text, qty: q, done: false };
    if(parts.length === 1 && extra){ if(extra.date) item.date = extra.date; if(extra.amt !== '') item.amt = extra.amt; }
    target.push(item);
    added++;
  });
  if(dup.length) toast(added ? `已略過 ${dup.length} 個重複項目` : `已有同名項目「${dup[0]}」（大小寫視為相同）`);
  if(added) commit();
}
const subHue = s => (typeof s.hue === 'number') ? s.hue : hue(s.id);
function pickHue(used){            // 隨機挑色相，並盡量和已有的小群組拉開距離
  let best = 0, bestD = -1;
  for(let i = 0; i < 30; i++){
    const c = Math.floor(Math.random() * 360);
    const d = used.length ? Math.min(...used.map(u => { const x = Math.abs(u - c) % 360; return Math.min(x, 360 - x); })) : 360;
    if(d > bestD){ bestD = d; best = c; }
  }
  return best;
}
function moveTicked(destId){
  const g = group(view); if(!g) return;
  const dest = destId ? g.items.find(x => x.id === destId)?.items : g.items;
  if(!dest) return;
  const picked = [];
  g.items.forEach(it => {
    if(isSub(it)){ if(it.items !== dest) it.items.forEach(c => { if(c.done) picked.push({ c, arr: it.items }); }); }
    else if(it.done && g.items !== dest) picked.push({ c: it, arr: g.items });
  });
  if(!picked.length){ toast('請先勾選要搬移的項目，再按 Move'); return; }
  picked.forEach(({ c, arr }) => { arr.splice(arr.indexOf(c), 1); c.done = false; dest.push(c); });
  const nm = destId ? g.items.find(x => x.id === destId).name : '最上層';
  toast(`已把 ${picked.length} 項搬到「${nm}」`);
  commit();
}
function addSub(name){
  const g = group(view); name = name.trim(); if(!g || !name) return;
  if(subNameTaken(g, name)){ toast(`已有同名小群組「${name}」（大小寫視為相同）`); return; }
  const sub = { id: uid(), name, items: [], collapsed: false, done: false, hue: pickHue(g.items.filter(isSub).map(subHue)) };
  let last = -1; g.items.forEach((x, i) => { if(isSub(x)) last = i; });
  if(last >= 0) g.items.splice(last + 1, 0, sub); else g.items.push(sub);        // 新的小群組緊接在其他小群組後面
  addTarget = sub.id; refocus = true;
  toast(`已建立「${name}」，接著新增的項目會放進去`);

}
function toggleItem(id){ const r = find(group(view), id); if(r){ r.it.done = !r.it.done; commit(); } }
function toggleSub(id){

function el(tag, attrs = {}, ...kids){
  const e = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs)){
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if(v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(k => e.append(k instanceof Node ? k : document.createTextNode(k)));
  return e;
}

  askDelete(`刪除群組「${g.name}」？`, (n ? `裡面有 ${n} 個項目，會一起刪除。` : '這個群組是空的。') + (configured() ? ' 這個群組會從你所有裝置的清單中消失。' : '') + (g.code ? ' 雲端上的內容不會被刪除，之後仍可用同步代碼再加入。' : ''), () => {
    setTimeout(() => askDelete('再確認一次', `真的要刪除「${g.name}」嗎？刪除後無法復原。`, () => deleteGroup(g.id), '確定刪除'), 60);
  }, '繼續');
}

/* 編輯輸入共用：Enter 存、Esc 取消、點別處自動存 */
function bindEdit(root, inputs, save, cancel){
  let fin = false;
  const doSave = () => { if(fin) return; fin = true; save(); };
  const doCancel = () => { if(fin) return; fin = true; cancel(); };
  inputs.forEach(i => i.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); doSave(); }
    else if(e.key === 'Escape'){ doCancel(); }
  }));
  root.addEventListener('focusout', () => setTimeout(() => { if(!root.contains(document.activeElement)) doSave(); }, 0));
  return doSave;
}
const stopEdit = () => { editing = null; render(); };

const letters = n => { let r = ''; n++; while(n > 0){ const m = (n - 1) % 26; r = String.fromCharCode(65 + m) + r; n = Math.floor((n - 1) / 26); } return r; };   // 0→A, 25→Z, 26→AA
function renderGroup(app, g){
  const lv = leaves(g), done = lv.filter(i => i.done).length, all = lv.length > 0 && done === lv.length;

  /* 標題：點兩下修改 */
  let title;
  if(editing && editing.id === '__title'){
    const inp = el('input', { type: 'text', class: 'title-in e-name', value: g.name, 'aria-label': '群組名稱' });
    title = el('div', { style: 'flex:1;display:flex;min-width:0' }, inp);
    bindEdit(title, [inp], () => { const v = inp.value.trim(), gg = group(view); if(v && gg){ if(norm(v) !== norm(gg.name) && groupNameTaken(v, gg.id)) toast(`已有同名群組「${v}」，名稱未更改`); else { gg.name = v; gg.nameT = Date.now(); } } editing = null; commit(); reconcileIndex(); }, stopEdit);
  } else {
    const startEdit = () => { editing = { id: '__title', field: 'text' }; render(); };
    title = el('h1', { title: '點兩下（手機：按住再放開）可修改名稱', onclick: () => { if(!blocked() && isDbl('__title')) startEdit(); } }, g.name);
    longPress(title, startEdit);
  }
  app.append(el('header', {},
    el('button', { class: 'icon-btn', onclick: () => goto(null), 'aria-label': '返回' }, '‹'),
    title, groupBadge(g),
    el('button', { class: 'icon-btn', onclick: () => openGroupMenu(g), 'aria-label': '群組選項' }, '⋯')));

  if(g.locked){ app.append(lockPanel(g)); return; }
  app.append(el('div', { class: 'toolbar' },
    el('button', { class: 'master', onclick: () => setAll(!all), 'aria-pressed': String(all) }, checkBox(all), all ? '全部取消' : '全選'),
    el('button', { class: 'btn ghost imp', onclick: pickImport, 'aria-label': '從 txt 檔匯入' }, '匯入'),
    el('span', { class: 'sum' }, lv.length ? `已完成 ${done} / ${lv.length}` : '')));

  if(!g.items.length){
    app.append(el('div', { class: 'empty' }, '還沒有項目。在下方輸入內容按「新增」，要分類就先按「小群組」。'));
  } else {
    const list = el('div', { class: 'list', 'data-container': 'root' });
    let ni = 0, ns = 0;
    g.items.forEach(it => list.append(isSub(it) ? subBlock(it, letters(ns++)) : itemRow(it, ++ni)));
    app.append(list);
  }
  document.body.append(buildAddBar(g));
}

function buildAddBar(g){
  const subs = g.items.filter(isSub);
  const money = !!(g.opts && g.opts.money);
  if(!subs.some(s => s.id === addTarget)) addTarget = '';
  let subMode = false;
  const sel = subs.length ? el('select', { class: 'a-sel', 'aria-label': '放入哪個小群組' },
    el('option', { value: '' }, '---'), subs.map(s => el('option', { value: s.id }, s.name))) : null;
  if(sel) sel.value = addTarget;
  const modeBtn = el('button', { class: 'btn mode', type: 'button', 'aria-pressed': 'false', title: '建立小群組', 'aria-label': '建立小群組' }, 'Ｇ');
  const name = el('input', { type: 'text', class: 'a-name', enterkeyhint: 'done' });
  const qty = el('input', { type: 'text', class: 'a-qty', inputmode: 'numeric', placeholder: '數量', 'aria-label': '數量' });
  const date = money ? el('input', { type: 'text', class: 'a-date', inputmode: 'numeric', maxlength: '10', placeholder: '日期 20261021', 'aria-label': '日期（西元年月日，例如 20261021）' }) : null;
  const amt = money ? el('input', { type: 'text', class: 'a-amt', inputmode: 'decimal', placeholder: '金額', 'aria-label': '金額' }) : null;
  const ok = el('button', { class: 'btn', type: 'button' }, '新增');
  const line2 = money ? el('div', { class: 'line2' }, date, amt, qty) : null;
  const subName = () => subs.find(s => s.id === addTarget)?.name;
  function paint(){
    modeBtn.classList.toggle('on', subMode); modeBtn.setAttribute('aria-pressed', String(subMode));
    if(money) line2.classList.toggle('hide', subMode); else qty.classList.toggle('hide', subMode);
    if(sel) sel.disabled = subMode;
    ok.textContent = subMode ? '＋' : '新增'; ok.setAttribute('aria-label', subMode ? '建立小群組' : '新增項目');
    const ph = subMode ? '輸入小群組名稱' : (addTarget ? `新增到「${subName()}」` : '輸入清單內容');
    name.placeholder = ph; name.setAttribute('aria-label', ph);
  }
  const go = () => {
    const v = name.value; if(!v.trim()) return;
    if(subMode){ addSub(v); return; }
    let extra = null;
    if(money){
      const d = parseDate(date.value), a = parseAmt(amt.value);
      if(d === null){ toast('日期請輸入 8 碼西元年月日，例如 20261021'); date.focus(); return; }
      if(a === null){ toast('金額請輸入數字'); amt.focus(); return; }
      extra = { date: d, amt: a };
    }
    refocus = true; addItems(addTarget || 'root', v, qty.value, extra);
  };
  modeBtn.addEventListener('click', () => { subMode = !subMode; paint(); name.focus(); });
  if(sel) sel.addEventListener('change', () => { addTarget = sel.value; paint(); });
  ok.addEventListener('click', go);
  [name, qty, date, amt].forEach(i => i && i.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing) go(); }));
  name.addEventListener('paste', e => {
    if(subMode) return;
    const t = (e.clipboardData || window.clipboardData).getData('text');
    if(t.includes('\n')){ e.preventDefault(); refocus = true; addItems(addTarget || 'root', t, ''); }
  });
  paint();
  return el('div', { class: 'addbar' }, el('div', { class: 'in' },
    el('div', { class: 'ctl' }, sel || '', modeBtn, sel ? el('button', { class: 'btn mode', type: 'button', title: '把打勾的項目搬到選好的小群組', 'aria-label': '搬移打勾的項目', onclick: () => moveTicked(sel.value) }, 'Ｍ') : ''),
    el('div', { class: 'line' }, name, money ? '' : qty, ok),
    line2 || ''));
}

/* ---------- 匯入 txt（每行「名稱╳數量」，追加到後面，不覆蓋原有內容） ---------- */
function pickImport(){
  const inp = el('input', { type: 'file', accept: '.txt,text/plain', class: 'hide' });
  const done = () => inp.remove();
  inp.addEventListener('cancel', done);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0]; done();
    if(!f) return;
    try{
      const buf = await f.arrayBuffer();
      let text;
      try{ text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }       // 一般 UTF-8
      catch(e){ text = new TextDecoder('big5').decode(buf); }                    // 記事本舊版「ANSI」存檔
      openImport(text.replace(/^\uFEFF/, ''));
    }catch(e){ console.error(e); toast('讀取檔案失敗'); }
  });
  document.body.append(inp); inp.click();
}
function openImport(text){
  const g = group(view); if(!g) return;
  const all = text.split(/\r?\n/).map(x => x.trim()).filter(Boolean).map(parseLine);
  if(!all.length){ toast('檔案裡沒有內容'); return; }
  const seen = new Set(), lines = [];
  all.forEach(l => { const k = norm(l.text); if(!seen.has(k) && !itemNameTaken(g, l.text)){ seen.add(k); lines.push(l); } });
  const skipped = all.length - lines.length;
  if(!lines.length){ toast('檔案裡的項目都已經存在，沒有可匯入的'); return; }
  const subs = g.items.filter(isSub);
  openDialog((f, close) => {
    const dest = el('select', { 'aria-label': '匯入到哪裡' }, el('option', { value: '' }, '最上層（不在小群組）'), subs.map(x => el('option', { value: x.id }, x.name)));
    dest.value = subs.some(x => x.id === addTarget) ? addTarget : '';
    const peek = lines.slice(0, 3).map(l => l.text + (l.qty ? '×' + l.qty : '')).join('、') + (lines.length > 3 ? '…' : '');
    f.append(el('h2', {}, `匯入 ${lines.length} 個項目`),
      el('p', {}, `新項目會加在「${g.name}」的最後面，原有內容不會被改動。` + (skipped ? `有 ${skipped} 個與現有項目或檔案內重複，會自動略過。` : '')),
      el('p', {}, '開頭幾筆：' + peek));
    if(subs.length) f.append(el('p', {}, '放到：'), dest);
    f.append(el('div', { class: 'acts' },
      el('button', { class: 'btn ghost', type: 'button', onclick: close }, '取消'),
      el('button', { class: 'btn', type: 'button', onclick: () => {
        close();
        const gg = group(view); if(!gg) return;
        const target = dest.value ? gg.items.find(x => x.id === dest.value)?.items : gg.items;
        if(!target) return;
        let n = 0;
        lines.forEach(l => { if(!itemNameTaken(gg, l.text)){ target.push({ id: uid(), text: l.text, qty: l.qty, done: false }); n++; } });
        commit(); toast(`已匯入 ${n} 項`);
      } }, '匯入')));
  });
}

function picBtn(it){
  const busy = uploadingId === it.id;
  return el('span', { class: 'pic', role: 'button', tabindex: '0', 'aria-label': it.img ? '查看照片' : '上傳照片',
    onclick: e => { e.stopPropagation(); if(blocked() || busy) return; it.img ? openViewer(it.id) : pickPhoto(it.id); },
    onkeydown: e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); e.target.click(); } } },
    busy ? '⏳' : it.img ? el('img', { src: it.img.t || it.img.u, alt: '', loading: 'lazy' }) : '☁️');
}
function pickPhoto(id){
  const inp = el('input', { type: 'file', accept: 'image/*', class: 'hide' });
  const done = () => inp.remove();
  inp.addEventListener('cancel', done);
  inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; done(); if(f) uploadPhoto(id, f); });
  document.body.append(inp); inp.click();
}
async function shrink(file){
  if(!PHOTO_MAX_SIDE) return file;
  try{
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const sc = Math.min(1, PHOTO_MAX_SIDE / Math.max(bmp.width, bmp.height));
    if(sc === 1 && file.type === 'image/jpeg') return file;
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.9));
  }catch(e){ return file; }
}
async function uploadPhoto(id, file){
  const gid = view;
  uploadingId = id; render(); toast('照片上傳中…');
  try{
    const blob = await shrink(file);
    const fd = new FormData(); fd.append('image', blob, 'photo.jpg');
    const res = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_KEY, { method: 'POST', body: fd });
    const j = await res.json();
    if(!j.success) throw new Error(j.error?.message || 'upload failed');
    const d = j.data, g = group(gid), r = g && find(g, id);
    uploadingId = null;
    if(r){ r.it.img = { u: d.display_url || d.url, t: (d.thumb && d.thumb.url) || d.url, d: d.delete_url || '' }; commit(g); toast('照片已上傳'); }
    else render();
  }catch(e){ console.error(e); uploadingId = null; render(); toast('上傳失敗，請檢查網路後再試'); }
}
function openViewer(id){
  const r = find(group(view), id); if(!r || !r.it.img) return;
  const it = r.it;
  const img = el('img', { src: it.img.u, alt: it.text });
  const box = el('div', { class: 'vbox' }, img);
  const ov = el('div', { class: 'viewer', role: 'dialog', 'aria-label': '照片' });
  const onKey = e => { if(e.key === 'Escape') close(); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  document.addEventListener('keydown', onKey);
  img.addEventListener('click', e => { e.stopPropagation(); box.classList.toggle('full'); });
  box.addEventListener('click', e => { if(e.target === box) close(); });
  const del = () => askDelete('刪除這張照片？',
    '照片會從這個項目移除。' + (it.img.d ? '如果也要從 imgbb 帳號徹底刪除，請先關閉這個視窗，再按照片下方的「imgbb 刪除頁」。' : ''),
    () => { const r2 = find(group(view), id); if(r2){ r2.it.img = null; commit(); } close(); });
  ov.append(
    el('div', { class: 'vbar' }, el('span', { class: 'vt' }, it.text),
      el('button', { class: 'btn warn vb', type: 'button', onclick: del }, 'DEL'),
      el('button', { class: 'btn ghost vb', type: 'button', onclick: close, 'aria-label': '關閉' }, '✕')),
    box,
    el('div', { class: 'vfoot' }, '點照片可切換「符合螢幕」與「原始大小」', it.img.d ? el('span', {}, '　·　', el('a', { href: it.img.d, target: '_blank', rel: 'noopener' }, 'imgbb 刪除頁 ↗')) : ''));
  document.body.append(ov);
}

function itemRow(it, n){
  if(editing && editing.id === it.id){
    const name = el('input', { type: 'text', class: 'e-name', value: it.text, 'aria-label': '項目名稱' });
    const qty = el('input', { type: 'text', class: 'e-qty', inputmode: 'numeric', value: it.qty === '' || it.qty == null ? '' : String(it.qty), placeholder: '數量', 'aria-label': '數量' });
    const row = el('div', { class: 'row editing', 'data-unit': it.id }, el('span', { class: 'num' }, n + '.'), name, qty,
      el('button', { class: 'ok', type: 'button', 'aria-label': '完成', onclick: () => row._save() }, '✓'));
    const g = group(view), cur = find(g, it.id), subs = g.items.filter(isSub);
    const curKey = cur && cur.arr !== g.items ? g.items.find(x => isSub(x) && x.items === cur.arr)?.id || '' : '';
    let where = null;
    if(subs.length){
      where = el('select', { 'aria-label': '放在哪個小群組' }, el('option', { value: '' }, '最上層（不在小群組）'), subs.map(x => el('option', { value: x.id }, x.name)));
      where.value = curKey;
      row.append(el('div', { class: 'mvline' }, '放在', where));
    }
    const money = !!(g.opts && g.opts.money);
    let dIn = null, aIn = null;
    if(money){
      dIn = el('input', { type: 'text', class: 'e-date', inputmode: 'numeric', maxlength: '10', value: it.date || '', placeholder: '日期 20261021', 'aria-label': '日期' });
      aIn = el('input', { type: 'text', class: 'e-amt', inputmode: 'decimal', value: (it.amt === undefined || it.amt === '') ? '' : String(it.amt), placeholder: '金額', 'aria-label': '金額' });
      row.append(el('div', { class: 'mvline' }, dIn, aIn));
    }
    row._save = bindEdit(row, [name, qty, ...(money ? [dIn, aIn] : [])], () => {
      const g2 = group(view), c2 = g2 && find(g2, it.id);          // 重新查一次，避免剛好同步到別台裝置的更新
      if(c2){
        const v = name.value.trim();
        if(v && norm(v) !== norm(c2.it.text) && itemNameTaken(g2, v, c2.it.id)) toast(`已有同名項目「${v}」，名稱未更改`); else if(v) c2.it.text = v;
        c2.it.qty = cleanQty(qty.value);
        if(money){
          const d = parseDate(dIn.value), a = parseAmt(aIn.value);
          if(d === null) toast('日期請輸入 8 碼，例如 20261021（日期未更改）'); else if(d) c2.it.date = d; else delete c2.it.date;
          if(a === null) toast('金額請輸入數字（金額未更改）'); else if(a !== '') c2.it.amt = a; else delete c2.it.amt;
        }
        if(where && where.value !== curKey){
          const dest = where.value ? g2.items.find(x => x.id === where.value)?.items : g2.items;
          if(dest && dest !== c2.arr){ c2.arr.splice(c2.arr.indexOf(c2.it), 1); dest.push(c2.it); if(where.value) addTarget = where.value; }
        }
      }
      editing = null; commit();
    }, stopEdit);
    return row;
  }
  const gm = group(view), metas = [];
  if(gm && gm.opts && gm.opts.money){
    if(it.date) metas.push(el('span', { class: 'meta' }, it.date));
    if(it.amt !== undefined && it.amt !== '') metas.push(el('span', { class: 'meta' }, fmtAmt(it.amt)));
  }
  const row = el('div', { class: 'row' + (it.done ? ' done on' : ''), 'data-unit': it.id, role: 'checkbox', 'aria-checked': String(!!it.done), tabindex: '0' },
    checkBox(it.done),
    el('span', { class: 'num' }, n + '.'),
    el('span', { class: 'txt' }, it.text, metas, picBtn(it)),
    el('span', { class: 'qty' }, it.qty ? '×' + it.qty : ''),
    el('button', { class: 'mini del', 'aria-label': '刪除 ' + it.text, onclick: e => { e.stopPropagation(); if(blocked()) return; askDelete(`刪除「${it.text}」？`, '刪除後無法復原。', () => removeById(it.id)); } }, '−'));
  row.addEventListener('click', e => {
    if(blocked() || e.target.closest('.del,.pic')) return;
    const t = e.target.closest('.txt,.qty');
    if(t){
      const field = t.classList.contains('qty') ? 'qty' : 'text';
      tapText(it.id, () => toggleItem(it.id), () => { editing = { id: it.id, field }; render(); });
      return;
    }
    toggleItem(it.id);
  });
  row.addEventListener('keydown', e => { if((e.key === ' ' || e.key === 'Enter') && e.target === row){ e.preventDefault(); row.click(); } });
  return row;
}

function subBlock(s, n){
  const done = subDone(s);
  const block = el('div', { class: 'sub', 'data-unit': s.id, style: `--h:${subHue(s)}` });
  let head;
  if(editing && editing.id === s.id){
    const name = el('input', { type: 'text', class: 'e-name', value: s.name, 'aria-label': '小群組名稱' });
    head = el('div', { class: 'row subhead editing' }, el('span', { class: 'num' }, n + '.'), name,
      el('button', { class: 'ok', type: 'button', 'aria-label': '完成', onclick: () => head._save() }, '✓'));
    head._save = bindEdit(head, [name], () => { const v = name.value.trim(), c2 = find(group(view), s.id); const g2 = group(view); if(v && c2){ if(norm(v) !== norm(c2.it.name) && subNameTaken(g2, v, c2.it.id)) toast(`已有同名小群組「${v}」，名稱未更改`); else c2.it.name = v; } editing = null; commit(); }, stopEdit);
  } else {
    const dn = s.items.filter(i => i.done).length;
    head = el('div', { class: 'row subhead' + (done ? ' done on' : '') },
      checkBox(done),
      el('span', { class: 'num' }, n + '.'),
      el('span', { class: 'txt' }, s.name),
      el('span', { class: 'cnt' }, s.items.length ? `${dn}/${s.items.length}` : ''),
      el('button', { class: 'mini fold', 'aria-label': s.collapsed ? '展開' : '收合', onclick: e => { e.stopPropagation(); if(!blocked()) toggleFold(s.id); } }, s.collapsed ? '▸' : '▾'),
      el('button', { class: 'mini del', 'aria-label': '刪除小群組 ' + s.name, onclick: e => { e.stopPropagation(); if(blocked()) return;
        askDelete(`刪除小群組「${s.name}」？`, s.items.length ? `裡面的 ${s.items.length} 個項目也會一起刪除，無法復原。` : '刪除後無法復原。', () => removeById(s.id)); } }, '−'));
    head.addEventListener('click', e => {
      if(blocked() || e.target.closest('.mini')) return;
      if(e.target.closest('.txt')){
        tapText(s.id, () => toggleSub(s.id), () => { editing = { id: s.id, field: 'text' }; render(); });
        return;
      }
      toggleSub(s.id);
    });
  }
  block.append(head);
  if(!s.collapsed){
    const ch = el('div', { class: 'children', 'data-container': s.id });
    s.items.forEach((it, i) => ch.append(itemRow(it, i + 1)));
    block.append(ch);
  }
  return block;
}

/* ---------- 拖曳（排序 / 拖進小群組 / 拉出小群組） ---------- */
let press = null, drag = null, suppressUntil = 0;
const HOLD_MS = 380;

document.addEventListener('contextmenu', e => { if(e.target.closest('.row:not(.editing)')) e.preventDefault(); });
document.addEventListener('selectstart', e => { if(press || drag) e.preventDefault(); });
document.addEventListener('touchmove', e => { if(drag) e.preventDefault(); }, { passive: false });

document.addEventListener('pointerdown', e => {
  if(!view || drag) return;
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  if(e.target.closest('.pic')) return;
  const grip = e.target.closest('.grip');
  if(!grip && e.target.closest('input,select,button,textarea')) return;
  const unit = e.target.closest('[data-unit]');
  if(!unit || unit.classList.contains('editing') || unit.querySelector(':scope > .editing')) return;
  const list = unit.parentElement;
  if(!list || !list.dataset.container) return;
  press = { unit, x: e.clientX, y: e.clientY, id: e.pointerId, touch: e.pointerType !== 'mouse' && !grip, timer: null,
    field: e.target.closest('.qty') ? 'qty' : 'text', onText: !!e.target.closest('.txt,.qty') };
  if(press.touch) press.timer = setTimeout(() => { if(press) startDrag(press.x, press.y); }, HOLD_MS);
});
document.addEventListener('pointermove', e => {
  if(drag){ if(e.pointerId === drag.pid) moveDrag(e.clientX, e.clientY); return; }
  if(!press || e.pointerId !== press.id) return;
  const dist = Math.hypot(e.clientX - press.x, e.clientY - press.y);
  if(press.touch){
    if(dist > 10){ clearTimeout(press.timer); press = null; }     // 手指移動 = 想捲動頁面
  } else if(dist > 4){ startDrag(press.x, press.y); moveDrag(e.clientX, e.clientY); }
});
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, e => {
  if(drag){ endDrag(); return; }
  if(press && e.pointerId === press.id){ clearTimeout(press.timer); press = null; }
}));

function startDrag(x, y){
  const p = press; clearTimeout(p.timer); press = null;
  const rect = p.unit.getBoundingClientRect();
  const ghost = p.unit.cloneNode(true);
  ghost.classList.add('dragghost');
  Object.assign(ghost.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px' });
  document.body.append(ghost);
  p.unit.classList.add('placeholder');
  document.body.classList.add('dragging');
  const isSubUnit = p.unit.classList.contains('sub');
  if(!isSubUnit) document.body.classList.add('drag-item');
  if(navigator.vibrate) navigator.vibrate(12);
  drag = { hold: p.touch && p.onText, field: p.field, moved: !p.touch, sx: x, sy: y, unit: p.unit, isSubUnit, root: document.querySelector('.list[data-container="root"]'), into: null,
    ghost, off: y - rect.top, x, y, pid: p.id,
    scroller: setInterval(() => {
      if(!drag) return;
      if(drag.y < 90) window.scrollBy(0, -12);
      else if(drag.y > window.innerHeight - 150) window.scrollBy(0, 12);
      else return;
      moveDrag(drag.x, drag.y);
    }, 16) };
}
function moveDrag(x, y){
  if(!drag) return;
  drag.x = x; drag.y = y;
  if(!drag.moved && Math.hypot(x - drag.sx, y - drag.sy) > 8) drag.moved = true;
  drag.ghost.style.top = (y - drag.off) + 'px';
  document.querySelectorAll('.sub.hot').forEach(n => n.classList.remove('hot'));
  let list = drag.root, before;       // before: undefined=依位置判斷, 節點=放在它前面, 'first'=放在最前面
  let into = null;
  if(!drag.isSubUnit){
    const hit = document.elementFromPoint(x, y);
    const ch = hit && hit.closest('.children');
    const sb = hit && hit.closest('.sub');
    if(ch){ list = ch; }
    else if(sb){
      const head = sb.querySelector(':scope > .subhead'), r = head.getBoundingClientRect();
      if(y < r.top + r.height / 2){ before = sb; }
      else {
        const c = sb.querySelector(':scope > .children');
        if(c){ list = c; before = 'first'; } else into = sb;      // 已收合的小群組：直接放進去
      }
    }
    const hs = into || (list !== drag.root ? list.closest('.sub') : null);
    if(hs) hs.classList.add('hot');
  }
  drag.into = into ? into.dataset.unit : null;
  if(into) return;
  const sibs = [...list.children].filter(c => c.dataset.unit && c !== drag.unit);
  if(before === 'first') before = sibs[0] || null;
  else if(before === undefined){
    before = null;
    for(const s of sibs){ const r = s.getBoundingClientRect(); if(y < r.top + r.height / 2){ before = s; break; } }
  }
  if(before){ if(drag.unit.nextElementSibling !== before || drag.unit.parentElement !== list) list.insertBefore(drag.unit, before); }
  else if(drag.unit.parentElement !== list || list.lastElementChild !== drag.unit) list.appendChild(drag.unit);
}
function endDrag(){
  const d = drag; drag = null;
  clearInterval(d.scroller); d.ghost.remove();
  d.unit.classList.remove('placeholder');
  document.body.classList.remove('dragging', 'drag-item');
  document.querySelectorAll('.sub.hot').forEach(n => n.classList.remove('hot'));
  suppressUntil = Date.now() + 400;
  if(d.hold && !d.moved){                 // 按住後沒有移動就放開 = 修改名稱
    editing = { id: d.unit.dataset.unit, field: d.field };
    pendingRender = false; render(); return;
  }
  const g = group(view);
  const total = () => g.items.reduce((n, it) => n + 1 + (isSub(it) ? it.items.length : 0), 0);
  const before = total();
  const map = new Map();
  g.items.forEach(it => { map.set(it.id, it); if(isSub(it)) it.items.forEach(c => map.set(c.id, c)); });
  if(d.into){
    const item = map.get(d.unit.dataset.unit), sub = map.get(d.into), r = item && find(g, item.id);
    if(r && sub && isSub(sub) && !isSub(item)){ r.arr.splice(r.arr.indexOf(item), 1); sub.items.push(item); }
  } else {
    const ids = l => [...l.children].filter(c => c.dataset.unit).map(c => c.dataset.unit);
    const newRoot = ids(d.root).map(i => map.get(i)).filter(Boolean);
    const newKids = new Map();
    g.items.filter(isSub).forEach(sb => {
      const cl = document.querySelector(`.children[data-container="${sb.id}"]`);
      if(cl) newKids.set(sb.id, ids(cl).map(i => map.get(i)).filter(x => x && !isSub(x)));
    });
    const after = newRoot.reduce((n, it) => n + 1 + (isSub(it) ? (newKids.get(it.id) || it.items).length : 0), 0);
    if(after === before){
      newKids.forEach((arr, id) => { const sb = map.get(id); sb.items.splice(0, sb.items.length, ...arr); });
      g.items.splice(0, g.items.length, ...newRoot);
    }
  }
  pendingRender = false;
  commit();
}

/* ---------- 對話框 ---------- */
function openDialog(build){
  const f = $('#dlgForm'); f.innerHTML = ''; build(f, () => $('#dlg').close()); $('#dlg').showModal();
}
function enterTo(input, fn){ input.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); fn(); } }); }
function askDelete(title, msg, onOk, okLabel = '刪除'){
  openDialog((f, close) => {
    f.append(el('h2', {}, title), el('p', {}, msg),
      el('div', { class: 'acts' },
        el('button', { class: 'btn ghost', type: 'button', onclick: close }, '取消'),
        el('button', { class: 'btn warn', type: 'button', onclick: () => { close(); onOk(); } }, okLabel)));
  });
}
function openGroupMenu(g){
  openDialog((f, close) => {
    const name = el('input', { type: 'text', value: g.name, 'aria-label': '群組名稱' });
    const code = el('input', { type: 'text', value: g.code || '', placeholder: '沒填 = 只存在這台裝置', autocapitalize: 'off', autocomplete: 'off', 'aria-label': '同步代碼' });
    const save = () => {
      const c = cleanCode(code.value);
      if(c && c.length < 6){ toast('同步代碼至少 6 個字元'); return; }
      if(c && !configured()){ toast('尚未設定 Firebase'); return; }
      close();
      renameGroup(g.id, name.value);
      if(!g.locked && moneyChk.checked !== !!(g.opts && g.opts.money)){ g.opts = { ...(g.opts || {}), money: moneyChk.checked }; commit(g); }
      if(g.locked){ if(c) unlockWithCode(g, c); return; }
      if(c !== (g.code || '')){
        if(!c){ stopListen(g.id); g.code = ''; saveLocal(); render(); toast('已停止同步，雲端資料仍保留'); }
        else attachCode(g, c);
      }
    };
    const moneyChk = el('input', { type: 'checkbox' }); moneyChk.checked = !!(g.opts && g.opts.money);
    enterTo(name, save); enterTo(code, save);
    f.append(el('h2', {}, '群組選項'),
      el('p', {}, '群組名稱'), name,
      el('p', {}, '同步代碼：使用相同代碼的裝置會共用這個群組。每個群組要用不同的代碼；只想自己看的，就用只有你知道的代碼。至少 6 個字元。'), code,
      g.locked ? '' : el('label', { class: 'chk' }, moneyChk, '啟用「日期、金額」欄位（購物清單用）'),
      el('div', { class: 'acts' },
        el('button', { class: 'btn danger', type: 'button', onclick: () => { close(); deleteGroupFlow(g); } }, 'DEL'),
        el('button', { class: 'btn', type: 'button', onclick: save }, 'SAVE')));
  });
}
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), Math.max(1800, m.length * 160)); }

localStorage.removeItem(LS_CODE);
if('scrollRestoration' in history) history.scrollRestoration = 'manual';
render();
window.scrollTo(0, (ui.y && ui.y[view || 'home']) || 0);
let scrollT = null;
window.addEventListener('scroll', () => {
  clearTimeout(scrollT);
  scrollT = setTimeout(() => { ui.y = ui.y || {}; ui.y[view || 'home'] = Math.round(window.scrollY); saveUI(); }, 150);
}, { passive: true });
window.addEventListener('pagehide', () => { ui.y = ui.y || {}; ui.y[view || 'home'] = Math.round(window.scrollY); saveUI(); });
state.groups.forEach(g => { if(g.code) listen(g); });
startIndex();
</script>
